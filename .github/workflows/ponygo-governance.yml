# ponygo 治理门（A5 = 薄适配器）：门禁逻辑本体在 .meta/gates/ci-verify.sh（A4），
# 换 forge 只换这几行壳；本地等价命令 = bash .meta/gates/ci-verify.sh
name: ponygo-governance
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 是「非执行者测试证据门」的硬前提：该门按 `--base <PR base sha>` 取提交范围，
      # 浅克隆（默认 depth=1）里没有 base 提交对象 ⇒ 门 fail-closed exit 2，首跑即红（PR #94 实测）。
      # 不靠门内 `git fetch` 自愈：门禁不应有网络副作用。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash .meta/gates/ci-verify.sh
      - run: bash .meta/gates/scratch-hygiene.sh && bash .meta/gates/scratch-hygiene.spec.sh
      - run: bash scripts/git-guard.spec.sh
      # ci-scope 决定「本次改动要不要跑 Rust 全量门」：判错方向等于门禁静默消失，
      # 故其正负样本必须与门禁本体同批执行（spec 内部在临时仓库里跑，不读真实工作区）。
      - run: bash scripts/ci-scope.spec.sh
      - run: bash .meta/gates/backlog-gate.sh
      - run: bash .meta/gates/backlog-gate.spec.sh
      # 零外部依赖的 Node/Bash 契约与构建治理自检（秒级快速阻断）
      - run: |
          npm run version:check
          npm run secrets:check:all
          npm run contract:bin-imports
          npm run contract:bin-imports:selftest
          npm run contract:check
          npm run contract:cli
          npm run ext:check
          npm run size:check
          npm run size:check:selftest
          npm run placeholder:selftest
          npm run placeholder:check
          npm run lock-scope:selftest
          npm run lock-scope:check
          npm run portable:ps1
          npm run portable:ps1:selftest
          npm run git:prune:selftest
          npm run release:push:selftest
          npm run artifacts:spec
          bash scripts/cargo-lane.spec.sh

      # dev-team 就绪纪律的机械看守（backlog:B1795571368443）：SKILL 的「测试证据须由非执行者
      # 产生」过去只是流程约束，执行者自跑 exit 0 即可放行。本步判「dev-team 批次改动了代码面时，
      # 提交信息里必须有一条产出者 ≠ 代码作者的 `Test-Evidence:` trailer」。正负样本与门禁本体
      # 同批执行（spec 在临时仓库里跑，不读真实工作区）。
      - name: 非执行者测试证据门（dev-team 批次）
        run: |
          bash scripts/check-independent-test-evidence.spec.sh
          node scripts/check-independent-test-evidence.mjs \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}"
