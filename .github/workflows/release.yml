# Pony Agent release — signed desktop updater

# 触发：推送 vX.Y.Z tag。启用前提：TAURI_SIGNING_PRIVATE_KEY secrets 已配置、
# tauri.conf.json 已启用 plugins.updater + createUpdaterArtifacts、前端常量已翻转。
# 产物门禁：发布前强制要求 Windows 桌面产物（NSIS 安装器 + updater 包）
# 全部存在，任一缺失即 hard fail，不允许发布。

name: release-signed-updater

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

# 同一 tag 的发布必须串行：重复的 tag push（例如删 tag 再推）会产生第二条 run，
# 两条并行时会互相抢 draft/publish（实测 v0.1.157 因此出现一条 success + 一条 failure）。
# cancel-in-progress=false：让后来者排队，靠发布步骤的幂等性收口，而不是取消正在跑的那条。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PONYSENTRY_CLIENT_TOKEN: ${{ secrets.PONYSENTRY_CLIENT_TOKEN }}
      # wave-18c：构建期烧录 token 到桌面二进制（option_env!），用户机器零环境变量依赖
      PONYSENTRY_BUILD_CLIENT_TOKEN: ${{ secrets.PONYSENTRY_CLIENT_TOKEN }}
      VITE_PONYSENTRY_CLIENT_TOKEN: ${{ secrets.PONYSENTRY_CLIENT_TOKEN }}
      VITE_PONYSENTRY_INGEST_URL: ${{ secrets.VITE_PONYSENTRY_INGEST_URL || 'https://ponysentry.ponyjob.top' }}
      # 发布态显式标记：`deployment.environment` 不再按 debug_assertions 推断。
      # 本地 `cargo build --release` 的 debug_assertions 同样是 false，若按编译档位判定会把
      # 开发机的会话误标成 production（实测已发生：本机 release 构建的 trace 进了生产维度）。
      # 只有本发布工作流会注入此标记 ⇒ 只有真正发布的产物才判 production。
      PONY_RELEASE_BUILD: "1"
      # 构建期烧录 OTel 准入 token：与 PonySentry token 同款取舍（ADR 0037 的构建期分发模式）。
      # 历史缺口：桌面端此前没有任何 token 分发通道，用户不手填 Settings 就静默 401、trace 全丢
      # （实测 24h 零 trace，同期探针正常）。烧录后安装包开箱即可上报，用户零配置。
      # 优先级最低（settings > env > 构建期），运维仍可覆盖。
      PONY_OTEL_BUILD_TOKEN: ${{ secrets.PONY_OTEL_TOKEN }}
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify secrets present (hard fail)
        shell: pwsh
        run: |
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -eq "") { throw "TAURI_SIGNING_PRIVATE_KEY is required" }
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" -eq "") { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required" }
          # wave-18c：PonySentry token 必须存在，经 PONYSENTRY_BUILD_CLIENT_TOKEN 烧录进桌面产物
          if ("${{ secrets.PONYSENTRY_CLIENT_TOKEN }}" -eq "") { throw "PONYSENTRY_CLIENT_TOKEN is required (burned into desktop build)" }
          if ("${{ secrets.VITE_PONYSENTRY_INGEST_URL }}" -eq "") { Write-Warning "VITE_PONYSENTRY_INGEST_URL is not set in secrets, using fallback https://ponysentry.ponyjob.top" }

      - name: Tag/version consistency
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -notmatch "^v$([regex]::Escape($pkg))$") { throw "tag $tag does not match package version $pkg" }

      - name: 决策记录校验
        shell: pwsh
        run: ./scripts/verify-decisions.ps1

      - name: 敏感信息与脱敏扫描
        run: npm run secrets:check:all

      - name: Version sync + frontend checks
        run: |
          npm run version:check
          npm run typecheck
          npm run test:unit

      # 直接执行 npx tauri build --bundles nsis；tauri.conf.json 内部的 beforeBuildCommand 会自动构建前端，避免双重执行
      - name: Build Windows desktop bundle with signed updater artifacts
        shell: pwsh
        run: |
          npx tauri build --bundles nsis

      - name: Gate — required artifacts present (Windows desktop, hard fail)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $errors = @()

          # Windows desktop installer + signed updater artifact
          # Tauri v2 NSIS updater mode produces: <product>_<ver>_x64-setup.exe + .sig (no tar.gz)
          $nsis = "target/release/bundle/nsis"
          $installer = Get-ChildItem $nsis -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { $errors += "Windows NSIS installer missing under $nsis" }

          # Signed updater signature (.sig next to the installer)
          if ($installer) {
            $sigPath = "$($installer.FullName).sig"
            if (-not (Test-Path $sigPath)) { $errors += "missing .sig for $($installer.Name)" }
          }

          if ($errors.Count -gt 0) {
            Write-Host "Required release artifacts missing:"
            $errors | ForEach-Object { Write-Host "  - $_" }
            throw "Release gate failed: require Windows desktop artifacts"
          }
          Write-Host "Release gate PASS: NSIS installer + signature present"

      - name: Generate release notes
        shell: pwsh
        run: |
          node scripts/release-notes.mjs --repo-root . --to "${{ github.ref_name }}" --out "target/release/bundle/nsis/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "release notes generation failed with exit code $LASTEXITCODE" }

      - name: Publish draft release, upload assets, assemble latest.json from uploaded names, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          # NOTE: GitHub keeps draft releases UNTAGGED ("untagged-…" html_url) until they
          # are published, so releases/tags/<tag> 404s on drafts. Resolve drafts by the
          # tag_name FIELD via the releases list endpoint instead.
          # 幂等：release 可能已由本 tag 的上一条 run 创建并发布（rerun/重试/串行排队都会命中）。
          # 关键：**只解析一次 release id 并全程使用它**。历史缺陷（v0.1.158 实测）——旧实现先在
          # 列表里 Select-Object -First 1 再取 assets，而同 tag 可能同时存在「有资产的已发布记录」
          # 与「空 draft」（删 tag 重推会让原 release 退回 draft，同时新 run 又 create 一条空的），
          # 于是取到空的那条 ⇒ 明明产物齐全却报 "got 0"。
          $nsis = "target/release/bundle/nsis"
          $allReleases = @(gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json)
          $sameTag = @($allReleases | Where-Object { $_.tag_name -eq $tag })
          # 优先选「已有 setup.exe 资产」的那条；其次选已发布的；都没有才新建。
          $picked = $sameTag | Where-Object { @($_.assets | Where-Object { $_.name -like "*-setup.exe" }).Count -ge 1 } | Select-Object -First 1
          if (-not $picked) { $picked = $sameTag | Where-Object { -not $_.draft } | Select-Object -First 1 }
          if (-not $picked) { $picked = $sameTag | Select-Object -First 1 }
          if ($picked) {
            $relId = $picked.id
            Write-Host "release $tag already exists (id=$relId, draft=$($picked.draft)); reusing it (idempotent rerun)"
            if ($sameTag.Count -gt 1) {
              Write-Host "WARN: found $($sameTag.Count) releases for tag ${tag}; using id=$relId (others: $((($sameTag | Where-Object { $_.id -ne $relId }).id) -join ', '))"
            }
          } else {
            # 注意：`gh release create` **不支持 --json**（那是 gh release view/list 的能力），
            # 旧写法会直接报错并被误报成 "failed to create release"（v0.1.159 实测）。
            gh release create "$tag" --draft --title "$tag" --notes-file "target/release/bundle/nsis/release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw "failed to create release $tag (gh exit $LASTEXITCODE)" }
            $relId = gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $relId) { throw "created release $tag but cannot resolve its id" }
            Write-Host "created draft release $tag (id=$relId)"
          }
          # Windows desktop assets: NSIS installer + its updater signature
          Get-ChildItem $nsis -Filter "*-setup.exe" | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }
          Get-ChildItem $nsis -Filter "*.sig" | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }

          # Compose latest.json from the POST-upload (GitHub-normalized) asset names:
          # GitHub uploads rename spaces to dots, so the local build name (with space)
          # would 404 in the updater. Read the draft's real asset list by release id.
          # Wait up to 45s for assets to become queryable via GitHub Releases API
          $rel = $null
          $setup = @()
          # 轮询解析目标 release —— **不区分 draft/published**。
          # 历史缺陷：旧实现只按 `.draft == true` 过滤，而串行化前可能已有另一条 run 把 release
          # 发布掉了 ⇒ 永远找不到 draft ⇒ 上游产物明明齐全却 throw "got 0"（v0.1.157 实测）。
          for ($retry = 0; $retry -lt 15; $retry++) {
            $rel = gh api "repos/$repo/releases/$relId" | ConvertFrom-Json
            $setup = @($rel.assets | Where-Object { $_.name -like "*-setup.exe" })
            if ($setup.Count -ge 1) { break }
            Start-Sleep -Seconds 3
          }
          if ($setup.Count -ne 1) {
            $seen = if ($rel) { (($rel.assets).name -join ", ") } else { "<release not found>" }
            throw "expected exactly one setup.exe asset in release id=$relId, got $($setup.Count): $seen"
          }
          $asset = $setup[0].name
          $assetUrl = [uri]::EscapeDataString($asset)
          $sigFile = Get-ChildItem $nsis -Filter "*.sig" | Select-Object -First 1
          if (-not $sigFile) { throw "missing local .sig under $nsis" }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $manifest = [ordered]@{
            version = $ver
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/$repo/releases/download/$tag/$assetUrl"
              }
            }
          }
          $manifest.notes = (Get-Content "target/release/bundle/nsis/release-notes.md" -Raw)
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "$nsis/latest.json" -Encoding utf8
          Write-Host "latest.json references uploaded asset: $asset"
          # latest.json last so /releases/latest/download/latest.json points to the new manifest
          gh release upload "$tag" "$nsis/latest.json" --clobber

          # Publish: 幂等 promote（已是 published/latest 时也不报错）
          gh release edit "$tag" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "failed to publish release $tag" }
          gh release edit "$tag" --latest
          if ($LASTEXITCODE -ne 0) { Write-Host "WARN: --latest failed (可能已是 latest)，继续" }

          # Regression gate (with retry): tag attachment + asset resolution propagate
          # asynchronously for a few seconds after publishing.
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            $tagged = gh api "repos/$repo/releases/tags/$tag" --jq '.html_url' 2>$null
            if ($LASTEXITCODE -eq 0 -and $tagged) {
              $manifestId = gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | select(.name=="latest.json") | .id' 2>$null
              if ($LASTEXITCODE -eq 0 -and $manifestId) { $ok = $true; break }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "published release verification failed: releases/tags/$tag not resolvable or latest.json missing" }
          Write-Host "release published and verified: $tag"
