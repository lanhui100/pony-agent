# Pony Agent release — signed desktop updater

# 触发：推送 vX.Y.Z tag。启用前提：TAURI_SIGNING_PRIVATE_KEY secrets 已配置、
# tauri.conf.json 已启用 plugins.updater + createUpdaterArtifacts、前端常量已翻转。
# 产物门禁：发布前强制要求 Windows 桌面产物（NSIS 安装器 + updater 包）
# 全部存在，任一缺失即 hard fail，不允许发布。

name: release-signed-updater

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

# 同一 tag 的发布必须串行：重复的 tag push（例如删 tag 再推）会产生第二条 run，
# 两条并行时会互相抢 draft/publish（实测 v0.1.157 因此出现一条 success + 一条 failure）。
# cancel-in-progress=false：让后来者排队，靠发布步骤的幂等性收口，而不是取消正在跑的那条。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PONYSENTRY_CLIENT_TOKEN: ${{ secrets.PONYSENTRY_CLIENT_TOKEN }}
      # wave-18c：构建期烧录 token 到桌面二进制（option_env!），用户机器零环境变量依赖
      PONYSENTRY_BUILD_CLIENT_TOKEN: ${{ secrets.PONYSENTRY_CLIENT_TOKEN }}
      VITE_PONYSENTRY_CLIENT_TOKEN: ${{ secrets.PONYSENTRY_CLIENT_TOKEN }}
      VITE_PONYSENTRY_INGEST_URL: ${{ secrets.VITE_PONYSENTRY_INGEST_URL || 'https://ponysentry.ponyjob.top' }}
      # 发布态显式标记：`deployment.environment` 不再按 debug_assertions 推断。
      # 本地 `cargo build --release` 的 debug_assertions 同样是 false，若按编译档位判定会把
      # 开发机的会话误标成 production（实测已发生：本机 release 构建的 trace 进了生产维度）。
      # 只有本发布工作流会注入此标记 ⇒ 只有真正发布的产物才判 production。
      PONY_RELEASE_BUILD: "1"
      # 构建期烧录 OTel 准入 token：与 PonySentry token 同款取舍（ADR 0037 的构建期分发模式）。
      # 历史缺口：桌面端此前没有任何 token 分发通道，用户不手填 Settings 就静默 401、trace 全丢
      # （实测 24h 零 trace，同期探针正常）。烧录后安装包开箱即可上报，用户零配置。
      # 优先级最低（settings > env > 构建期），运维仍可覆盖。
      PONY_OTEL_BUILD_TOKEN: ${{ secrets.PONY_OTEL_TOKEN }}
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify secrets present (hard fail)
        shell: pwsh
        run: |
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -eq "") { throw "TAURI_SIGNING_PRIVATE_KEY is required" }
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" -eq "") { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required" }
          # wave-18c：PonySentry token 必须存在，经 PONYSENTRY_BUILD_CLIENT_TOKEN 烧录进桌面产物
          if ("${{ secrets.PONYSENTRY_CLIENT_TOKEN }}" -eq "") { throw "PONYSENTRY_CLIENT_TOKEN is required (burned into desktop build)" }
          if ("${{ secrets.VITE_PONYSENTRY_INGEST_URL }}" -eq "") { Write-Warning "VITE_PONYSENTRY_INGEST_URL is not set in secrets, using fallback https://ponysentry.ponyjob.top" }

      - name: Tag/version consistency
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -notmatch "^v$([regex]::Escape($pkg))$") { throw "tag $tag does not match package version $pkg" }

      - name: 决策记录校验
        shell: pwsh
        run: ./scripts/verify-decisions.ps1

      - name: 敏感信息与脱敏扫描
        run: npm run secrets:check:all

      - name: Version sync + frontend checks
        run: |
          npm run version:check
          npm run typecheck
          npm run test:unit

      # 直接执行 npx tauri build --bundles nsis；tauri.conf.json 内部的 beforeBuildCommand 会自动构建前端，避免双重执行
      - name: Build Windows desktop bundle with signed updater artifacts
        shell: pwsh
        run: |
          npx tauri build --bundles nsis

      - name: Gate — required artifacts present (Windows desktop, hard fail)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $errors = @()

          # Windows desktop installer + signed updater artifact
          # Tauri v2 NSIS updater mode produces: <product>_<ver>_x64-setup.exe + .sig (no tar.gz)
          $nsis = "target/release/bundle/nsis"
          $installer = Get-ChildItem $nsis -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { $errors += "Windows NSIS installer missing under $nsis" }

          # Signed updater signature (.sig next to the installer)
          if ($installer) {
            $sigPath = "$($installer.FullName).sig"
            if (-not (Test-Path $sigPath)) { $errors += "missing .sig for $($installer.Name)" }
          }

          if ($errors.Count -gt 0) {
            Write-Host "Required release artifacts missing:"
            $errors | ForEach-Object { Write-Host "  - $_" }
            throw "Release gate failed: require Windows desktop artifacts"
          }
          Write-Host "Release gate PASS: NSIS installer + signature present"

      - name: Generate release notes
        shell: pwsh
        run: |
          node scripts/release-notes.mjs --repo-root . --to "${{ github.ref_name }}" --out "target/release/bundle/nsis/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "release notes generation failed with exit code $LASTEXITCODE" }

      - name: Publish draft release, upload assets, assemble latest.json from uploaded names, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          # NOTE: GitHub keeps draft releases UNTAGGED ("untagged-…" html_url) until they
          # are published, so releases/tags/<tag> 404s on drafts. Resolve drafts by the
          # tag_name FIELD via the releases list endpoint instead.
          # 幂等：release 可能已由本 tag 的上一条 run 创建并发布（rerun/重试/串行排队都会命中）。
          # 关键：**只解析一次 release id 并全程使用它**。历史缺陷（v0.1.158 实测）——旧实现先在
          # 列表里 Select-Object -First 1 再取 assets，而同 tag 可能同时存在「有资产的已发布记录」
          # 与「空 draft」（删 tag 重推会让原 release 退回 draft，同时新 run 又 create 一条空的），
          # 于是取到空的那条 ⇒ 明明产物齐全却报 "got 0"。
          $nsis = "target/release/bundle/nsis"

          # ── 解析/创建目标 release ────────────────────────────────────────────────
          # 只用 **tag** 作为句柄，全程不需要 release id。原因（三次发版失败换来的教训）：
          #   1) 草稿 release 是 **untagged** 的（html_url 形如 untagged-…），
          #      `releases/tags/<tag>` 对草稿必然 404 —— 本文件顶部注释早已写明；
          #   2) 该列表端点有**最终一致性**：创建后立刻查询可能暂时查不到（v0.1.161 实测），
          #      所以解析必须带重试，不能"查一次没有就报错"；
          #   3) 删 tag 重推会让旧 release 退回草稿并可能并存多条同 tag 记录，
          #      用 id 反而容易取到空的那条。用 tag + "谁的资产最全" 择优最稳。
          function Resolve-ReleaseByTag {
            param([string]$Repo, [string]$Tag)
            $list = @(gh api "repos/$Repo/releases?per_page=100" 2>$null | ConvertFrom-Json)
            $same = @($list | Where-Object { $_.tag_name -eq $Tag })
            # 优先「已有 setup.exe 资产」的那条；其次已发布的；再次最新创建的
            $withAsset = $same | Where-Object { @($_.assets | Where-Object { $_.name -like "*-setup.exe" }).Count -ge 1 } | Select-Object -First 1
            if ($withAsset) { return $withAsset }
            $published = $same | Where-Object { -not $_.draft } | Select-Object -First 1
            if ($published) { return $published }
            return ($same | Sort-Object created_at -Descending | Select-Object -First 1)
          }

          $rel = $null
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            $rel = Resolve-ReleaseByTag -Repo $repo -Tag $tag
            if ($rel) { break }
            Start-Sleep -Seconds 3
          }
          if ($rel) {
            Write-Host "release $tag already exists (id=$($rel.id), draft=$($rel.draft)); reusing it (idempotent rerun)"
          } else {
            # `gh release create` 不支持 --json（那是 view/list 的能力）。
            gh release create "$tag" --draft --title "$tag" --notes-file "target/release/bundle/nsis/release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw "failed to create release $tag (gh exit $LASTEXITCODE)" }
            # 草稿是 untagged + 列表最终一致 ⇒ 创建后必须重试等待可见，再取引用。
            for ($attempt = 0; $attempt -lt 15; $attempt++) {
              $rel = Resolve-ReleaseByTag -Repo $repo -Tag $tag
              if ($rel) { break }
              Start-Sleep -Seconds 3
            }
            if (-not $rel) { throw "created draft release $tag but it never appeared in releases list (60s)" }
            Write-Host "created draft release $tag (id=$($rel.id))"
          }

          # Windows desktop assets: NSIS installer + its updater signature
          Get-ChildItem $nsis -Filter "*-setup.exe" | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }
          Get-ChildItem $nsis -Filter "*.sig" | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }

          # 上传后资产可见性同样有延迟：按 tag 重新解析，直到看到恰好一个 setup.exe。
          $setup = @()
          for ($retry = 0; $retry -lt 20; $retry++) {
            $rel = Resolve-ReleaseByTag -Repo $repo -Tag $tag
            $setup = @($rel.assets | Where-Object { $_.name -like "*-setup.exe" })
            if ($setup.Count -ge 1) { break }
            Start-Sleep -Seconds 3
          }
          if ($setup.Count -ne 1) {
            $seen = if ($rel) { (($rel.assets).name -join ", ") } else { "<release not found>" }
            # 诊断信息：把列表端点实际返回的 tag 采样打出来，避免下次再靠猜
            $diag = @(gh api "repos/$repo/releases?per_page=100" 2>$null | ConvertFrom-Json)
            $sample = (($diag | Select-Object -First 5 | ForEach-Object { "$($_.tag_name)[draft=$($_.draft)]" }) -join ", ")
            throw ("expected exactly one setup.exe asset for tag ${tag}, got $($setup.Count): $seen" +
                   " | list_count=$($diag.Count) sample=$sample")
          }
          $asset = $setup[0].name
          $assetUrl = [uri]::EscapeDataString($asset)
          $sigFile = Get-ChildItem $nsis -Filter "*.sig" | Select-Object -First 1
          if (-not $sigFile) { throw "missing local .sig under $nsis" }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $manifest = [ordered]@{
            version = $ver
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/$repo/releases/download/$tag/$assetUrl"
              }
            }
          }
          $manifest.notes = (Get-Content "target/release/bundle/nsis/release-notes.md" -Raw)
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "$nsis/latest.json" -Encoding utf8
          Write-Host "latest.json references uploaded asset: $asset"
          # latest.json last so /releases/latest/download/latest.json points to the new manifest
          gh release upload "$tag" "$nsis/latest.json" --clobber

          # Publish: 幂等 promote（已是 published/latest 时也不报错）
          gh release edit "$tag" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "failed to publish release $tag" }
          gh release edit "$tag" --latest
          if ($LASTEXITCODE -ne 0) { Write-Host "WARN: --latest failed (可能已是 latest)，继续" }

          # Regression gate (with retry): tag attachment + asset resolution propagate
          # asynchronously for a few seconds after publishing.
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            $tagged = gh api "repos/$repo/releases/tags/$tag" --jq '.html_url' 2>$null
            if ($LASTEXITCODE -eq 0 -and $tagged) {
              $manifestId = gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | select(.name=="latest.json") | .id' 2>$null
              if ($LASTEXITCODE -eq 0 -and $manifestId) { $ok = $true; break }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "published release verification failed: releases/tags/$tag not resolvable or latest.json missing" }
          Write-Host "release published and verified: $tag"

      - name: 发送企业微信发版通知
        if: success()
        env:
          WX_WORK_EXTERNAL_API_URL: ${{ secrets.WX_WORK_EXTERNAL_API_URL }}
          WX_WORK_EXTERNAL_API_KEY: ${{ secrets.WX_WORK_EXTERNAL_API_KEY }}
          WX_WORK_TO_USER: ${{ vars.WX_WORK_TO_USER || 'MaHui' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/send-wecom-notification.mjs "${{ github.ref_name }}"

  # wave-67：CLI（`pony` 二进制）自更新发布。契约真值源
  # `.dev-team/contract-matrix-cli-self-update.md` C3；多平台矩阵与清单单点装配见 [ADR 0108]
  # （`docs/decisions/0108-cli-release-platform-matrix.md`）。
  #
  # 发布平台、「哪个平台必须成功」的唯一真值源是 `scripts/cli-platforms.mjs`；
  # `node scripts/check-cli-release-contract.mjs`（已接入 `npm run verify`）在本文件矩阵、
  # 真值源、客户端 `current_platform()` 词表三方不一致时非零退出。新增平台必须同批改两处。
  #
  # 为什么挂在桌面 job 之后：`build-and-release` 内部完成 publish（draft → published），CLI 资产只能
  # 在发布后用 `gh release upload --clobber` 追加。
  #
  # 【已知风险·显式登记】若 publish-cli 失败，发布已发生但缺少 `pony-cli-latest.json`：客户端发现逻辑
  # 会回落到更旧的「含清单」release（优雅降级），不会把坏版本推给用户；但新 CLI 版本在一段时间内不可见。
  # 因此这些 job 只做「构建 + 追加资产 + 收尾断言」，任何一步失败都让 run 红，由人补跑，绝不静默。
  build-cli:
    needs: build-and-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs_on: ubuntu-latest
            required: true
            linux_deps: true
          - platform: linux-aarch64
            runs_on: ubuntu-24.04-arm
            required: false
            linux_deps: true
          - platform: macos-aarch64
            runs_on: macos-latest
            required: false
            linux_deps: false
    runs-on: ${{ matrix.runs_on }}
    # 必需平台失败 = 整次发版红。边缘平台（首次接入、未经本机验证）失败只让该平台本轮资产缺席，
    # publish-cli 会在日志里显式列出缺失平台；用户侧得到的是明确的 UnsupportedPlatform + 清单已有平台，
    # 而不是坏字节。不允许「承诺了但不发」无声通过。
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # CI verify 作业同款依赖（.github/workflows/ci.yml:84）：keyring 的 linux 后端经 libdbus-sys
      # 需要 dbus-1.pc，native-tls 需要 openssl 头文件；缺失时 cargo build 会直接 panic（v0.1.184 首跑实证）。
      - name: Install Linux build deps
        if: matrix.linux_deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config

      - name: Build pony CLI binary (${{ matrix.platform }})
        run: cargo build --release --bin pony

      # 版本链 fail-closed：CLI 二进制只承载 `pony-agent-core` 的版本（本仓是 core / tauri-app 两条独立
      # 版本线），因此**只与 core Cargo.toml 比对**，不与 package.json 比对。
      - name: Assert CLI version matches core version
        id: ver
        run: |
          set -euo pipefail
          # v0.1.184 二跑实证：`pony --version` 首行可能被日志行（otel::init warn 走 stdout 的 JSON）占位，
          # 因此不能取 head -1，必须按版本号模式提取（仍 fail-closed：提不到就报错退出）。
          ver="$(./target/release/pony --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          core="$(grep -m1 '^version' crates/pony-agent-core/Cargo.toml | cut -d'"' -f2)"
          echo "cli_version=$ver core_version=$core platform=${{ matrix.platform }}"
          if [ -z "$ver" ] || [ "$ver" != "$core" ]; then
            echo "::error::CLI 版本 ($ver) 与 crates/pony-agent-core/Cargo.toml ($core) 不一致（core 版本链 fail-closed）"
            exit 1
          fi
          # 资产名 = pony-tui_<core 版本>_<平台标识>，由 scripts/cli-platforms.mjs::assetNameFor 定义。
          mv target/release/pony "pony-tui_${ver}_${{ matrix.platform }}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Upload per-platform CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: pony-tui_${{ steps.ver.outputs.ver }}_${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  # 清单只在这里装配并上传：单一实现（scripts/build-cli-manifest.mjs，本机有单测）+ 单点写入。
  # 矩阵化后若各 build job 自己写清单，会互相 `--clobber` 覆盖同一份 pony-cli-latest.json，
  # 最终只剩最后一个跑完的平台 —— 这正是 ADR 0108 要消灭的「清单与发布事实错位」。
  publish-cli:
    needs: build-cli
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 门禁与清单脚本都用 node 跑；显式钉版本，不赌 runner 预装。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download per-platform CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist-cli
          merge-multiple: true

      - name: Resolve core version
        id: core
        run: |
          set -euo pipefail
          core="$(grep -m1 '^version' crates/pony-agent-core/Cargo.toml | cut -d'"' -f2)"
          if [ -z "$core" ]; then
            echo "::error::读不到 crates/pony-agent-core/Cargo.toml 的 version"
            exit 1
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"

      # 发布侧 fail-closed 门禁（ADR 0097）：清单 version 必须**严格大于**上一个已发布清单的 version。
      # 清单 version = 该 tag 的 core 版本，而 `release.mjs --target tauri` 这类只 bump tauri 的发版会让
      # 清单版本恒定 ⇒ 所有客户端永远判「已是最新」，本次 CLI 构建永远不会被下载，且客户端侧无报错可看。
      - name: Assert CLI version advances over previous release manifest
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          cur="${{ steps.core.outputs.core }}"
          prev="none"
          # 与客户端发现同一口径回看：published 且非 draft，最多 20 条，取第一个含清单的 release。
          for candidate in $(gh api "repos/$repo/releases?per_page=20" \
              --jq '.[] | select(.draft == false) | .tag_name'); do
            if [ "$candidate" = "$tag" ]; then
              continue
            fi
            if gh release download "$candidate" --repo "$repo" \
                 --pattern pony-cli-latest.json \
                 --output /tmp/prev-cli-manifest.json --clobber 2>/dev/null; then
              prev="$(node -e 'const fs=require("fs");process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).version))' /tmp/prev-cli-manifest.json)"
              echo "previous manifest: $candidate -> $prev"
              break
            fi
          done
          node scripts/check-cli-manifest-advances.mjs --current "$cur" --previous "$prev"

      # 清单本体 + 每平台 `.sha256` 旁证文件都由这一个脚本产出（摘要口径单一实现，
      # 顺带消灭 GNU `sha256sum` 与 BSD `shasum` 的差异）。必需平台缺制品 ⇒ 非零退出。
      - name: Assemble CLI manifest
        run: |
          set -euo pipefail
          node scripts/build-cli-manifest.mjs \
            --version "${{ steps.core.outputs.core }}" \
            --dir dist-cli \
            --out dist-cli/pony-cli-latest.json

      - name: Upload CLI assets to release
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ver="${{ steps.core.outputs.core }}"
          shopt -s nullglob
          files=(dist-cli/pony-tui_"${ver}"_*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::dist-cli 里没有任何 CLI 制品（build-cli 全矩阵失败或被跳过）"
            exit 1
          fi
          echo "uploading: ${files[*]} dist-cli/pony-cli-latest.json"
          gh release upload "$tag" "${files[@]}" dist-cli/pony-cli-latest.json --clobber

      # 收尾断言：清单必须真的挂在该 tag 上，且清单 version == 本轮 core 版本、清单平台集合 == 实际上传集合。
      - name: Verify CLI manifest on published release
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          ver="${{ steps.core.outputs.core }}"
          names="$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets[].name')"
          echo "assets on $tag:"
          echo "$names"
          echo "$names" | grep -qx "pony-cli-latest.json" || {
            echo "::error::release $tag 缺少 pony-cli-latest.json（客户端发现会回落到更旧 release）"
            exit 1
          }
          gh release download "$tag" --pattern pony-cli-latest.json --output /tmp/pony-cli-latest.json --clobber
          manifest_ver="$(node -e 'const fs=require("fs");process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).version))' /tmp/pony-cli-latest.json)"
          echo "manifest_version=$manifest_ver expected=$ver"
          if [ "$manifest_ver" != "$ver" ]; then
            echo "::error::清单 version ($manifest_ver) 与本轮 CLI 版本 ($ver) 不一致"
            exit 1
          fi
          # 清单声明的每个平台都必须真的能在该 release 上取到（防「清单里有、资产上没有」：
          # 客户端会下 404 或误用别的 release 的字节）。
          for platform in $(node -e 'const fs=require("fs");for(const k of Object.keys(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).platforms))console.log(k)' /tmp/pony-cli-latest.json); do
            echo "$names" | grep -qx "pony-tui_${ver}_${platform}" || {
              echo "::error::清单声明了 $platform，但 release 上没有 pony-tui_${ver}_${platform} 资产"
              exit 1
            }
          done
