# Pony Agent release — signed desktop updater + CLI

# 触发：推送 vX.Y.Z tag。启用前提：TAURI_SIGNING_PRIVATE_KEY secrets 已配置、
# tauri.conf.json 已启用 plugins.updater + createUpdaterArtifacts、前端常量已翻转。
# 产物门禁：发布前强制要求 Windows 桌面产物（NSIS 安装器 + updater 包）与
# CLI 二进制（non_tauri_harness）全部存在，任一缺失即 hard fail，不允许发布。

name: release-signed-updater

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify secrets present (hard fail)
        shell: pwsh
        run: |
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -eq "") { throw "TAURI_SIGNING_PRIVATE_KEY is required" }
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" -eq "") { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required" }
      - name: Tag/version consistency
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -notmatch "^v$([regex]::Escape($pkg))$") { throw "tag $tag does not match package version $pkg" }
      - name: Version sync + frontend checks
        run: |
          npm run version:check
          npm run typecheck
          npm run test:unit
      - name: Rust check (desktop + CLI)
        run: |
          npm run cargo:check
          cargo check --release -p pony-agent-core --bin non_tauri_harness

  build-release:
    needs: verify
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows desktop bundle with signed updater artifacts
        shell: pwsh
        run: |
          npm run build
          npx tauri build --bundles nsis
      - name: Build CLI binary (non_tauri_harness)
        shell: pwsh
        run: |
          cargo build --release -p pony-agent-core --bin non_tauri_harness
      - name: Gate — required artifacts present (Windows desktop + CLI, hard fail)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $errors = @()

          # Windows desktop installer (NSIS)
          $nsis = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $nsis -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { $errors += "Windows NSIS installer missing under $nsis" }

          # Signed updater artifact (.tar.gz + .sig)
          $bundle = "src-tauri/target/release/bundle/updater"
          $archive = Get-ChildItem $bundle -Filter "*.tar.gz" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $archive) { $errors += "updater .tar.gz missing under $bundle" }
          if ($archive) {
            $sigPath = "$($archive.FullName).sig"
            if (-not (Test-Path $sigPath)) { $errors += "missing .sig for $($archive.Name)" }
          }

          # CLI binary (Windows)
          $cli = "target/release/non_tauri_harness.exe"
          if (-not (Test-Path $cli)) { $errors += "CLI binary missing: $cli" }

          if ($errors.Count -gt 0) {
            Write-Host "Required release artifacts missing:"
            $errors | ForEach-Object { Write-Host "  - $_" }
            throw "Release gate failed: require Windows desktop AND CLI artifacts"
          }
          Write-Host "Release gate PASS: NSIS installer, updater archive+sig, CLI binary present"
      - name: Assemble latest.json from produced artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $bundle = "src-tauri/target/release/bundle/updater"
          $archive = Get-ChildItem $bundle -Filter "*.tar.gz" | Select-Object -First 1
          $sigPath = "$($archive.FullName).sig"
          $signature = (Get-Content $sigPath -Raw).Trim()
          $asset = $archive.Name
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $manifest = [ordered]@{
            version = $ver
            notes   = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/$repo/releases/download/$tag/$asset"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "$bundle/latest.json" -Encoding utf8
          Write-Host "latest.json written"
      - name: Publish draft release and upload assets (latest.json last)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" --draft --title "$tag" --notes "Automated signed release (Windows desktop + CLI)"
          # Windows desktop assets
          $nsis = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem $nsis -Filter "*-setup.exe" | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }
          $bundle = "src-tauri/target/release/bundle/updater"
          Get-ChildItem $bundle -Filter "*.tar.gz" | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }
          Get-ChildItem $bundle -Filter "*.sig" | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }
          # CLI binary
          gh release upload "$tag" "target/release/non_tauri_harness.exe" --clobber
          # latest.json last so /releases/latest/download/latest.json points to the new manifest
          gh release upload "$tag" "$bundle/latest.json" --clobber
          gh release edit "$tag" --latest
          Write-Host "release published: $tag"

  smoke:
    needs: build-release
    if: false # 预留：下载产物 + 篡改/错误 key/安装冒烟；启用后按 §6 手册补证据
    runs-on: windows-latest
    steps:
      - run: echo "signed smoke steps (tamper/wrong-key/install evidence) to be implemented per docs/release/signed-updater.md"
