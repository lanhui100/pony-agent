name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR 新提交到达时取消陈旧在跑 CI（push 到 main 永不取消）
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 最小令牌：CI 只读代码，不发布产物
permissions:
  contents: read

jobs:
  # 变更面判定：单点决定「本次改动是否落在 Rust 编译/测试面内」。
  # 为什么单独成 job：verify（Windows）与 core-platform-check（Linux/macOS 矩阵）都需要这个
  # 结论，各算一次 git diff 会漂移。判定逻辑与正负样本在 scripts/ci-scope.mjs +
  # scripts/ci-scope.spec.sh（spec 由 ponygo-governance 工作流执行，本 job 只消费输出）。
  # fail-safe 口径：base 解析不了 / 脚本意外 ⇒ needs_rust=true（多跑一次，绝不少跑一次）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      needs_rust: ${{ steps.scope.outputs.needs_rust }}
      needs_frontend: ${{ steps.scope.outputs.needs_frontend }}
      needs_core: ${{ steps.scope.outputs.needs_core }}
      needs_tui: ${{ steps.scope.outputs.needs_tui }}
      needs_cli: ${{ steps.scope.outputs.needs_cli }}
      needs_tauri: ${{ steps.scope.outputs.needs_tauri }}
      scope_reason: ${{ steps.scope.outputs.scope_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ci-scope 要 diff PR base 与 HEAD；浅克隆拿不到 base 提交 ⇒ 退化成「永远全量」。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 变更面判定
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          node scripts/ci-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 以下 Rust 步骤统一挂 needs_rust：纯文档/账本 PR 不该为一次 .md 改动付 Windows
      # 全量 cargo 构建（实测 32min，见 ADR 2026-11-20-ci-scope-split）。
      # 「必过」语义不变：job 名仍是 verify、仍必然出现并 success，只是内部跳过编译面。
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: needs.changes.outputs.needs_rust == 'true'
        with:
          # B245：与 rust-toolchain.toml 同值，clippy 门基线按该工具链生成；显式写死避免 action 默认取 latest。
          # 禁用内置 rust-cache：下文显式按 check/test 槽位分别缓存，避免重复上传下载。
          toolchain: "1.91.1"
          components: clippy
          cache: false

      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.needs_rust == 'true'
        with:
          tool: cargo-nextest

      # 缓存必须对齐 AGENT.md 的 target 槽位约定：check 与 test 分别设 prefix-key 隔离缓存
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.needs_rust == 'true'
        with:
          prefix-key: v0-rust-check
          workspaces: . -> target-check

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.needs_rust == 'true'
        with:
          prefix-key: v0-rust-test
          workspaces: . -> target-test

      # L3 穷举层的第一块基石：以下检查不可被 --no-verify 绕过
      - name: 决策记录校验（L1 同款 + 穷举）
        shell: pwsh
        run: ./scripts/verify-decisions.ps1

      - name: 版本同步校验（四处一致）
        shell: pwsh
        run: ./scripts/check-version-sync.ps1

      - name: 敏感信息与脱敏扫描（全库纳管文件）
        run: node scripts/check-secrets.mjs --all

      # 收口契约的可执行门禁已独立为 .github/workflows/observability-gate.yml
      # （只依赖 git + node，秒级独立红绿；不再挂在 verify 的长时间构建后面）。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查与前端构建（产出 dist/ 供后续 Tauri 集成与回归复用）
        if: needs.changes.outputs.needs_frontend == 'true'
        run: npm run build

      - name: 前端单元测试
        if: needs.changes.outputs.needs_frontend == 'true'
        run: npm run test:unit

      - name: 前后端及 CLI 契约与扩展点一致性
        run: |
          npm run contract:check
          npm run contract:cli
          npm run ext:check
          npm run contract:bin-imports
          npm run contract:bin-imports:selftest

      # 文件规模棘轮（B261 / 6c-2）：`npm run verify` 里本来就含 `size:check`，但 CI 的
      # verify job 是拆开跑的（typecheck/test:unit/cargo check/clippy），于是这条门**从不在
      # CI 上执行**——main 上曾长期带 4 条新增超限而无人发现。这里补上，口径与本地 verify 一致。
      # 纯 node + git，秒级；基线 `scripts/file-size-baseline.json` 只许下调或随「几行级漂移」
      # 显式重基线（`npm run size:check:update`，提交前必须 review diff）。
      - name: 文件规模棘轮（≤3000 行/文件、≤200 行/函数、≤8 层嵌套）
        run: npm run size:check

      - name: Rust 检查（shared 槽位，deny-warnings 与发版构建对齐）
        if: needs.changes.outputs.needs_rust == 'true'
        env:
          RUSTFLAGS: -D warnings
        run: npm run cargo:check:shared

      # Clippy 棘轮门（B244）：与 cargo check 的 `-D warnings` 职责不同——本步只判
      # 「.meta/lints 表的新增债是否为零」，存量在 scripts/clippy-baseline.json 的
      # platforms.win32 分册冻结（该分册由 lint-baseline-bootstrap 工作流在 Windows runner
      # 生成，禁止套用 Linux 口径：cfg(windows) 让违例集合不同）。
      - name: Clippy 棘轮门 + 门自检（Windows 分册；存量冻结，新增/恶化即红）
        if: needs.changes.outputs.needs_rust == 'true'
        run: |
          npm run rust:lint:selftest
          npm run rust:lint

      - name: Clippy 棘轮门（src-tauri 分册；第二份基线，B244 扩面）
        if: needs.changes.outputs.needs_rust == 'true' && needs.changes.outputs.needs_tauri == 'true'
        run: npm run rust:lint:tauri

      # tools/tui-audit/*.py 需要 Pillow（render_ansi.py: from PIL import Image）。
      # Windows runner 预装 Python 但不带 Pillow ⇒ tui_audit_*_regression 4 例因
      # ModuleNotFoundError: No module named 'PIL' 恒红（既有 Windows 可移植性缺口）。
      - name: Python 审计依赖（tools/tui-audit：Pillow + fontTools）
        if: needs.changes.outputs.needs_tui == 'true'
        run: python3 -m pip install --disable-pip-version-check pillow fonttools

      # 首错即停会掩盖整批平台缺口：cargo test 默认首个失败用例即中止，
      # 同 runner 上后续用例根本不会执行，缺口只能靠多轮 CI 逐层剥出。
      # 代价已知：Windows 全量首跑十连红即为代价（B050–B066）。
      - name: Core 单元与集成测试（含 Windows Job 生命周期；nextest 进程级隔离防 OnceLock 互染）
        if: needs.changes.outputs.needs_core == 'true'
        run: |
          node scripts/invoke-rust-target.mjs test nextest run --profile ci -p pony-protocol -p pony-observability -p pony-storage -p pony-provider -p pony-tools -p pony-acp -p pony-agent-core --no-fail-fast
          npm run cargo:test:shared -- -p pony-protocol -p pony-observability -p pony-storage -p pony-provider -p pony-tools -p pony-acp -p pony-agent-core --doc --no-fail-fast

      - name: TUI 与 CLI 套件测试
        if: needs.changes.outputs.needs_tui == 'true' || needs.changes.outputs.needs_cli == 'true'
        run: node scripts/invoke-rust-target.mjs test nextest run --profile ci -p pony-tui -p pony-cli --no-fail-fast

      - name: Tauri 宿主回归测试（session/provider/tool_router/stop_registry）
        if: needs.changes.outputs.needs_core == 'true'
        run: node scripts/invoke-rust-target.mjs test nextest run --profile ci -p pony-agent-core --test session_storage_suite --test runtime_suite --test tools_stop_suite --no-fail-fast

  core-platform-check:
    needs: changes
    if: needs.changes.outputs.needs_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # B245：与 rust-toolchain.toml 同值，clippy 门基线按该工具链生成；显式写死避免 action 默认取 latest。
          toolchain: "1.91.1"
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-check
          workspaces: . -> target-check
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'
        with:
          prefix-key: v0-rust-test
          workspaces: . -> target-test
      - name: Linux 系统依赖（core + tauri 2 合并单次安装）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Core 非 Windows cfg 编译检查（deny-warnings 与发版构建对齐）
        env:
          RUSTFLAGS: -D warnings
        shell: pwsh
        run: ./scripts/invoke-rust-target.ps1 check check --package=pony-agent-core

      # Clippy 棘轮门与上面两步职责不同、不可互相替代：
      #   cargo check 那步（RUSTFLAGS=-D warnings）判"rustc 默认告警是否清零"；
      #   本步判"clippy 表（.meta/lints/）的新增债是否为零"——存量在 scripts/clippy-baseline.json 冻结。
      # 基线按平台分册（platforms.<os>）：cfg(windows)/cfg(unix) 让违例集合不同（实测 24% 存量
      # 落在平台门控文件里），因此 Linux/macOS/Windows 各用各的分册（B244 起三分册齐备）。
      # 门自持 lint 级别（脚本内清空 RUSTFLAGS 并注入 -W/-A），否则 -D warnings 会把可数的 warning
      # 变成 error，棘轮失去记账面。表/阈值被改动但未重基线时 exit 2（口径漂移 fail-closed）。
      - name: Clippy 棘轮门 + 门自检（各平台分册；存量冻结，新增/恶化即红）
        if: runner.os != 'Windows'
        run: |
          npm run rust:lint:selftest
          npm run rust:lint

      - name: Clippy 棘轮门（src-tauri 分册；第二份基线，B244 扩面）
        if: runner.os != 'Windows' && needs.changes.outputs.needs_tauri == 'true'
        run: npm run rust:lint:tauri
      - name: 工作区底层及核心 crate lib 单元测试（Linux-only）
        if: runner.os == 'Linux' && needs.changes.outputs.needs_core == 'true'
        env:
          RUSTFLAGS: -D warnings
        run: node scripts/invoke-rust-target.mjs test test -p pony-protocol -p pony-observability -p pony-storage -p pony-provider -p pony-tools -p pony-acp -p pony-agent-core --lib

      - name: TUI 与 CLI 单元测试（Linux-only）
        if: runner.os == 'Linux' && (needs.changes.outputs.needs_tui == 'true' || needs.changes.outputs.needs_cli == 'true')
        env:
          RUSTFLAGS: -D warnings
        run: node scripts/invoke-rust-target.mjs test test -p pony-tui -p pony-cli --lib

      # PTY 族 4 例在 Windows 上已被 #[cfg_attr(windows, ignore)] 平台 gating（Windows 无
      # PTY 驱动，缺口 B067）⇒ 若 Linux 侧没有执行点，gating 直接等于「覆盖消失」。
      # 故在 ubuntu 分支补一个真实执行点。本步骤只挂 Linux：macOS 分支未覆盖，是待办而非已覆盖。
      - name: Core Linux 集成：PTY 族（Windows 上已平台 gating）
        if: runner.os == 'Linux' && needs.changes.outputs.needs_tui == 'true'
        run: |
          node scripts/invoke-rust-target.mjs test test --package=pony-tui --test tui_suite -- tui_startup_input_guard
          node scripts/invoke-rust-target.mjs test test --package=pony-tui --test tui_suite -- tui_overlay_cancel_acceptance
