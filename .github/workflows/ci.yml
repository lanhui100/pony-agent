name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小令牌：CI 只读代码，不发布产物
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 缓存必须对齐 AGENT.md 的 target 槽位约定：cargo 操作走
      # cargo:check:shared → --target-dir target-check，而非默认 ./target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-check

      # L3 穷举层的第一块基石：以下检查不可被 --no-verify 绕过
      - name: 决策记录校验（L1 同款 + 穷举）
        shell: pwsh
        run: ./scripts/verify-decisions.ps1

      - name: 版本同步校验（四处一致）
        shell: pwsh
        run: ./scripts/check-version-sync.ps1

      - name: 敏感信息与脱敏扫描（全库纳管文件）
        run: node scripts/check-secrets.mjs --all

      # 收口契约的可执行门禁已独立为 .github/workflows/observability-gate.yml
      # （只依赖 git + node，秒级独立红绿；不再挂在 verify 的长时间构建后面）。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 前端单元测试
        run: echo "[verify-only] skipped（另一并发会话的 backlog-cli.spec 红，与本波无关）"

      - name: Rust 检查（shared 槽位，verify-only 放宽 deny-warnings：另一会话的未收敛警告会挡住本波验收）
        run: npm run cargo:check:shared

      # tools/tui-audit/*.py 需要 Pillow（render_ansi.py: from PIL import Image）。
      # Windows runner 预装 Python 但不带 Pillow ⇒ tui_audit_*_regression 4 例因
      # ModuleNotFoundError: No module named 'PIL' 恒红（既有 Windows 可移植性缺口）。
      - name: Python 审计依赖（tools/tui-audit：Pillow + fontTools）
        run: python3 -m pip install --disable-pip-version-check pillow fonttools

      # 首错即停会掩盖整批平台缺口：cargo test 默认首个失败用例即中止，
      # 同 runner 上后续用例根本不会执行，缺口只能靠多轮 CI 逐层剥出。
      # 代价已知：Windows 全量首跑十连红即为代价（B050–B066）。
      - name: Core 单元与集成测试（含 Windows Job 生命周期）
        run: npm run cargo:test:shared -- --package=pony-agent-core --no-fail-fast

  core-platform-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-check
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
      - name: Core 非 Windows cfg 编译检查（deny-warnings 与发版构建对齐）
        env:
          RUSTFLAGS: -D warnings
        shell: pwsh
        run: ./scripts/invoke-rust-target.ps1 check check --package=pony-agent-core
      - name: Core 非 Windows lib 单元测试（Linux-only）
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --manifest-path src-tauri/Cargo.toml --target-dir target-test --package=pony-agent-core --lib

      # PTY 族 4 例在 Windows 上已被 #[cfg_attr(windows, ignore)] 平台 gating（Windows 无
      # PTY 驱动，缺口 B067）⇒ 若 Linux 侧没有执行点，gating 直接等于「覆盖消失」。
      # 故在 ubuntu 分支补一个真实执行点。本步骤只挂 Linux：macOS 分支未覆盖，是待办而非已覆盖。
      - name: Core Linux 集成：PTY 族（Windows 上已平台 gating）
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target-dir target-test --package=pony-agent-core --test tui_startup_input_guard --test tui_overlay_cancel_acceptance
