name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小令牌：CI 只读代码，不发布产物
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 缓存必须对齐 AGENT.md 的 target 槽位约定：cargo 操作走
      # cargo:check:shared → --target-dir target-check，而非默认 ./target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-check

      # L3 穷举层的第一块基石：以下检查不可被 --no-verify 绕过
      - name: 决策记录校验（L1 同款 + 穷举）
        shell: pwsh
        run: ./scripts/verify-decisions.ps1

      - name: 版本同步校验（四处一致）
        shell: pwsh
        run: ./scripts/check-version-sync.ps1

      - name: 敏感信息与脱敏扫描（全库纳管文件）
        run: node scripts/check-secrets.mjs --all

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 前端单元测试
        run: npm run test:unit

      - name: Rust 检查（shared 槽位）
        run: npm run cargo:check:shared

      - name: Core 单元与集成测试（含 Windows Job 生命周期）
        run: npm run cargo:test:shared -- --package=pony-agent-core

  core-platform-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-check
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
      - name: Core 非 Windows cfg 编译检查
        shell: pwsh
        run: ./scripts/invoke-rust-target.ps1 check check --package=pony-agent-core
