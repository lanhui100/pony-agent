name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小令牌：CI 只读代码，不发布产物
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 缓存必须对齐 AGENT.md 的 target 槽位约定：cargo 操作走
      # cargo:check:shared → --target-dir target-check，而非默认 ./target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-check

      # L3 穷举层的第一块基石：以下检查不可被 --no-verify 绕过
      - name: 决策记录校验（L1 同款 + 穷举）
        shell: pwsh
        run: ./scripts/verify-decisions.ps1

      - name: 版本同步校验（四处一致）
        shell: pwsh
        run: ./scripts/check-version-sync.ps1

      - name: 安装依赖
        run: npm ci

      # PA-102：canonical spec 曾长期漂移（39/53 为 delta 格式）而无人发现，
      # 因为 strict 校验从未进 CI。必须在 npm ci 之后（依赖 OpenSpec CLI）。
      - name: OpenSpec 严格校验（specs + changes）
        shell: pwsh
        run: ./scripts/check-openspec.ps1

      - name: 类型检查
        run: npm run typecheck

      - name: 前端单元测试
        run: npm run test:unit

      - name: Rust 检查（shared 槽位）
        run: npm run cargo:check:shared
