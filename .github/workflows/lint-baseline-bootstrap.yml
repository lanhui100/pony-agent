name: lint-baseline-bootstrap

# B244：Windows/macOS 的 clippy 棘轮基线分册**必须在对应平台生成**（cfg(windows)/cfg(unix)
# 让违例集合不同，禁止套用 Linux 口径）。本工作流只在 workflow_dispatch 手动触发：
# 各平台跑一次 `rust:lint:update --allow-growth`（首建册）并上传 scripts/clippy-baseline.json，
# 由维护者下载、review diff 后合入（基线是棘轮存量账，不接受 CI 自动写入）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 与 rust-toolchain.toml / 主 CI 同一 pin：基线口径必须与门一致（B245/B244）。
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.91.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-check

      - name: 生成 pony-agent-core 分册（首建，允许存量）
        run: node scripts/check-clippy-baseline.mjs --update-baseline --allow-growth

      # B244：src-tauri 扫描面（第二份基线，包名 pony-agent）。与 core 分册同平台生成。
      - name: 生成 src-tauri 分册（首建，允许存量）
        run: node scripts/check-clippy-baseline.mjs --package pony-agent --baseline scripts/clippy-baseline-src-tauri.json --update-baseline --allow-growth

      - uses: actions/upload-artifact@v4
        with:
          name: clippy-baselines-${{ runner.os }}
          path: |
            scripts/clippy-baseline.json
            scripts/clippy-baseline-src-tauri.json
          if-no-files-found: error
