[package]
name = "pony-agent"
version = "0.1.75"
description = "Tauri + Rust rewrite scaffold for Hermes Agent"
authors = ["HUAWEI"]
edition = "2021"
default-run = "pony-agent"

[lib]
name = "pony_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
pony-agent-core = { path = "../crates/pony-agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = ["image-png"] }
window-vibrancy = "0.6.0"
raw-window-handle = "0.6"









































































