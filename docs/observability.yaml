# pony-agent 的可观测性适用性声明
# 形状：~/.agents/skills/observability-onboarding/references/declaration.schema.json
# 判定：声明说「该不该有」，巡检说「实际有没有」，两者交叉才是结论（规则家：declaration-rubric.md）。
# 结构性依据：`.dev-team/evidence/wave43/observability-applicability.md`（wave-43 适配性裁决）。
service: pony-agent
kind: desktop
reviewed_at: "2026-11-09"
# PA-172（ADR 0104 / wave-69）归属说明：上游调用时限与重试配置化 + 跨 provider 有界故障转移。
# 新增 7 个结构化日志事件（provider_failover_switched / _skipped_cooldown / _exhausted、
# provider_cooldown_reset、upstream_policy_clamped、upstream_policy_invalid_value、
# failover_candidate_ignored）——metrics 与 logs 维度仍是**结构性 N-A**（桌面/TUI 无常驻监听地址、
# 无 /metrics、pull 模型不成立，判定不变），故这些事件只作本地取证面，**不新增 applicable 判定、
# 不新增 enforcement_point**；错误分类器的家仍在 agent/retry.rs（error_classifier 收口点只覆盖
# Ask 不可恢复挂起族，未被本波改动）。

# PA-173（ADR 0104「PA-173 修订」）归属说明：上游策略三处缺陷修复。
# (1) 钳制语义迁移：`upstream_policy_clamped` 事件的**发射点**从 normalize_storage（读写共用）
#     移到生效策略解析 `ProviderRegistryStore::upstream_policy()`（配置面读取），事件名/字段
#     （field/provided/clamped_to/bound）不变 ⇒ **无新增事件、无 schema 变更**；
# (2) 三个下界上调（15000 / 2 / 5000）：纯常量，不产生遥测面；
# (3) 批量 followup 补齐重试：复用既有 `provider_log` 的 `{label}:attempt=N/M failed class=…`
#     行，label = `followup_sync_batch` —— 属**本地日志行**，非结构化事件、不做上报，
#     metrics/logs 维度仍是结构性 N-A（桌面进程无常驻监听地址、无 /metrics）。
# ⇒ 本卡不新增 applicable 判定、不新增 enforcement_point，tracing 收口点仍是 agent/otel/mod.rs。

# PA-174（ADR 0104「PA-174 修订」）归属说明：轮次历史接入（P1/P2）+ F1/F2/F3 遗留收口。
# (1) P1 历史重建发生在**会话装载**（`SqliteSessionBackend::load_store` → 读 `turn_events`），
#     读的是本地 sqlite，无新增网络出口；失败降级为「保持空历史」而不造数据。
# (2) P2/F1/F2 只改消息角色与重试时序，复用既有 `provider_log` 行（`{label}:attempt=N/M`）与
#     per-attempt 错误日志 ⇒ 无新增结构化事件。
# (3) F3 新增**对外接口**：`ponycli config effective`（stdout 单行 JSON：disk_policy /
#     effective_policy / clamped_fields）。它是一条本地只读 CLI 出口，不上报、不含密钥，
#     故 metrics / logs 维持结构性 N-A；issues 维度不变（异常仍走既有 PonySentry 边界）。
# ⇒ 本卡不新增 applicable 判定、不新增 enforcement_point；tracing 收口点仍是 agent/otel/mod.rs。

# Trace 审核 loop（ADR 0101 / PA-168..170）归属说明：loop 会话复用 ponycli headless 既有 OTel 出口
# （tracing anchor 不变，仍 agent/otel/mod.rs），自身即维度 6 的审计对象（自举）；scripts/audit/* 确定性
# 节点只产本地回执，无新增网络遥测面；fetch 查询 Tempo/Langfuse 复用 check-langfuse.sh 凭据纪律
# （只走管道/env，UNKNOWN ≠ PASS）。不新增 applicable 判定，不新增 enforcement_point。
# 会话库单写者冲突 fail-closed + 启动装载预算（ADR 0106）归属说明：
# (1) 四维归属不变：tracing / issues 仍 applicable（唯一落点不变 agent/otel/mod.rs、
#     agent/ponysentry/client.rs），metrics / logs 维持结构性 N-A（桌面/TUI 无常驻监听地址、
#     无 /metrics、pull 模型不成立）。本波无新增网络端点、依赖、指标或 Loki 上送路径。
# (2) 新增**本地取证面**（非遥测出口）：锁文件 `<db>.lock` 写入持有者 `pid` / 启动时间 / 命令行；
#     `single_instance_lock_denied` 升级为带 `holder pid=… cmd=… since=…`；
#     启动期修复新增 `startup_self_heal_skipped: component=…`（index_projection 之外的维护项）与
#     `startup_repair_commit: reasons=…`；退出证据的快速查询失败走 `persistence_evidence_fallback`。
#     均为本地 stderr → 运行日志文件的行，不上报、不含消息正文与凭据。
# (3) 新增一个**本地调参**环境变量 `PONY_STARTUP_SELF_HEAL_BUDGET_MS`（默认 1200ms，`0` = 跳过启动自愈；
#     非法值回退默认）。它是启动预算旋钮，不是遥测出口，不改变任何上报口径。
# (4) 行为变更（非遥测）：TUI 在 `HeldByOther` 时 fail-closed 并非零退出；退出提示只在会话确已落库时
#     承诺 `pony resume <id>`。不改变持久化 schema（锁文件仍是既有 `<db>.lock`，旧实例不解析其内容）。
# ⇒ 不新增 applicable 判定、不新增 enforcement_point。

dimensions:
  tracing:
    applicable: true
    # OTel 初始化/导出/资源属性的唯一落点（span 与 resource 构造、配置解析、traceparent 注入器都在这个模块）
    anchor: crates/pony-agent-core/src/agent/otel/mod.rs
    # 检索口径补充（declaration-rubric §7 / 方案 C）：只扩大检索面，不改变 applicable 的判定。
    # 事实依据：公网 OTLP edge 把 service.name 改写成 desktop-client（原名挪到 client.service.name），
    # dev 机自报名带环境后缀（pony-agent → pony-agent-dev）；内置两键
    # （service.name=pony-agent / client.service.name=pony-agent）在 24h 窗皆为 0 ⇒ 假缺口。
    # 下面两条键于 2026-11-07 实测（exact 游标，非采样外推）：24h 窗各 117 条，7d 窗各自撞 200 条查询上限。
    # 数字随时间漂移，判定只依赖「>0 且有量级」，不要把上面的具体值当断言基线。
    query:
      identity_probes:
        - id: env-suffix-client-service-name
          query_type: traceql
          query: '{ resource.client.service.name=~"pony-agent.*" }'
          note: >-
            dev/测试机自报 service.name 带 -dev 后缀，edge 又把 service.name 统一改成 desktop-client，
            原值只落在 client.service.name。前缀通配收敛在本项目命名空间内（不是 .* 全通配），
            故不会命中他人服务。
        - id: stable-pony-app-name
          query_type: traceql
          query: '{ resource.pony.app.name="pony-agent" }'
          note: >-
            pony.app.name 由 otel/mod.rs 的 RESOURCE_PONY_APP_NAME 写入，带 pony. 前缀故不参与 edge
            改写，是两条接入路径（内网直连 collector / 公网 edge）唯一一致的跨路径检索键。
            实测 tags 形态（resource.pony.app.name=pony-agent）返回 0，traceql 形态 24h=115，
            故此处用 traceql。
  issues:
    applicable: true
    # PonySentry ingest 客户端（事件上报/幂等键 event_id/trace_id 回填/重试都在这里）
    anchor: crates/pony-agent-core/src/agent/ponysentry/client.rs
  metrics:
    applicable: false
    reason: >-
      桌面端（Tauri）+ CLI/TUI + headless harness 交付形态：进程随用户窗口启停，无常驻监听地址、
      无 Service、不进集群，Prometheus pull 模型的前提（稳定可达的 /metrics）结构上不成立。
      这不是「还没接」，而是这套接法不适用于该交付形态；为让巡检变绿而伪造 /metrics 已被明确拒绝。
  logs:
    applicable: false
    reason: >-
      日志采集是节点侧 fluentd 按容器日志路径白名单（/var/log/containers/*.log）tail；
      桌面端进程不在容器里、不产生该路径，节点侧采集结构上不适用。Wave-4 起桌面端日志已落
      `<app_data_dir>/logs/pony-agent.log`（单行 JSON + trace_id + 512KiB 轮转），但那是用户数据面
      的本地取证面；不上送 Loki 仍是结构性选择而非缺口。

enforcement_points:
  error_boundary:
    path: src/components/common/ErrorBoundary.vue
    guarantees:
      - breadcrumbs
      - trace_id
    forbidden_in_other_files:
      - pattern: "\\bonErrorCaptured\\s*\\("
        hint: 前端组件级异常捕获必须统一使用 ErrorBoundary.vue 统一收口与上报，禁止在别处私自声明 onErrorCaptured

  http_client:
    path: crates/pony-agent-core/src/agent/otel/mod.rs
    guarantees:
      - traceparent
      - timeout
    forbidden_in_other_files:
      - pattern: "\\bheader\\s*\\(\\s*[\"']traceparent[\"']"
        hint: 出网 HTTP 请求必须通过 otel::with_current_traceparent / traceparent_header_map_from 统一注入 traceparent，禁止手写硬编码请求头

  error_classifier:
    # ask-resume 收口点（只覆盖「Ask 不可恢复挂起」这一族，不宣称全仓唯一分类器）：
    # 判据 `suspension_is_unrecoverable`（Interaction + run_id 缺失 ⇒ 不可恢复）、
    # 文案构造 `build_ask_resume_unavailable_error`、以及流式/非流式共用的
    # `build_unrecoverable_suspension_error` 都只在这个文件里。
    path: crates/pony-agent-core/src/agent/runtime/turn_control.rs
    guarantees:
      - classify
    forbidden_in_other_files:
      - pattern: "(const\\s+ASK_RESUME_UNAVAILABLE_CODE|ASK_RESUME_UNAVAILABLE_CODE\\s*:)"
        hint: 'Ask 不可恢复挂起的错误码常量只允许在 crates/pony-agent-core/src/agent/runtime/turn_control.rs 定义、文案只允许由 build_ask_resume_unavailable_error() 构造；别处禁止复制该常量或用 `{CODE}:` 自拼文案（错误码分裂会让宿主提示、断言与告警同时失效）。判据：宿主经 runtime 的 pub 再导出引用 ASK_RESUME_UNAVAILABLE_CODE（tui.rs 即如此），全仓 grep -c "const ASK_RESUME_UNAVAILABLE_CODE" 期望 1'
      - pattern: "(=\\s*\"ask_resume_unavailable\"|\"ask_resume_unavailable\"\\s*\\.to_string\\(\\))"
        hint: 'wire-code 字面量不得在第二处被**定义/赋值**（改码时会漏改，宿主提示与断言随即分裂）。判据：全仓（排除 tests/、docs/、.dev-team/）`grep -rn "= \"ask_resume_unavailable\""` 期望 1，且仅出现在收口点 turn_control.rs 的 const 行；宿主的日志/提示必须引用 ASK_RESUME_UNAVAILABLE_CODE 常量拼接。说明：tools/tui-audit/checks.py 的 `"ask_resume_unavailable",` 是**审计探针的期望值**（断言目标，不是定义点），按本 pattern 不构成命中'

note: >-
  【收口点落地说明（Stage-1 Protocol）】
  (1) error_boundary: 收敛至 src/components/common/ErrorBoundary.vue，提供 Vue 3 onErrorCaptured 拦截、优雅降级及上报。
  (2) http_client: 收敛至 crates/pony-agent-core/src/agent/otel/mod.rs，提供统一 with_current_traceparent 注入防重复与超时保证。
  【历史 backlog 留存】
  (0) Wave-4 已收敛但**未达 enforcement_point 标准**（故暂不声明）：
      traceparent 注入收敛为单一 helper `otel::with_current_traceparent` /
      `traceparent_header_map`（provider ×4、model_catalog、tools ×2、PonySentry worker 共 8 点
      全部经它注入，insert 语义防重复）；OTel 配置解析收敛为 `otel::resolve_config`
      （settings > env > default，缺省公网端点 https://otel.ponyjob.top）；
      trace_id 语义已分离：`exported_trace_id()` 供 issue/会话 DTO，`current_trace_id()` 供日志/traceparent。
      不写 enforcement_point 的理由：reqwest 客户端本身仍是 4 处直连，helper 只能约束「调用者主动调它」，
      无法用 forbidden 正则可靠拦截「新增客户端却不调 helper」，写了会造成假绿。
  (1) http_client：无统一网络出口 —— Rust 侧 4 处直接 reqwest::Client
      （agent/otel/mod.rs、agent/tools.rs、agent/provider/mod.rs、agent/ponysentry/client.rs），
      前端另有直接 fetch（src/lib/telemetry.ts、src/lib/update-check.ts）。
  (2) error_boundary：无唯一边界 —— 前端 src/main.ts 有全局 errorHandler/unhandledrejection，
      Rust 侧多处 catch_unwind 与各自上报路径尚未收敛到一个 re-export 边界。
  (3) error_classifier：crates/pony-agent-core/src/agent/error_code.rs 提供 ErrorCode/ErrorCategory，
      但 retry.rs 的 classify 与各 provider 仍各自分类（该模块头注释亦写明「只新增不改旧分支」），
      故它不是唯一分类器。
  (4) issue 上报存在两条实现：前端 src/lib/telemetry.ts 直接 fetch ingest，Rust 走
      agent/ponysentry/client.rs。
  (5) 无 journey.yaml（anchor_events 机制未启用）。
  收口点建好之后再按 schema 补 enforcement_points（path + guarantees + forbidden_in_other_files），
  且顺序是先确认「当前无违规」再写 forbidden，避免门禁一落地就红。
  【wave-44 归属登记】前端 `[workspace-scroll]` 调试通道新增显式开关
  （`pony-agent.debug.workspace-scroll` / `?debug=1|scroll` / DEV，默认生产关闭），属开发者诊断输出，
  非结构化日志出口：四维归属不变（logs 仍为结构性 N-A），不新增 metrics/tracing/issues 面。
  审计事实与优化点见 `docs/audit/observability-audit-2026-10-25.md`。
  【wave-45 归属登记】tracing 维度新增 resource 归因属性：`service.version`（默认 core crate 版本，
  可由 `PONY_OTEL_SERVICE_VERSION` 覆盖）与 `deployment.environment`（默认 debug=`development` /
  release=`production`，可由 `PONY_OTEL_ENVIRONMENT` 覆盖）。维度归属不变（仍为 tracing，唯一落点仍是
  `crates/pony-agent-core/src/agent/otel/mod.rs`），不新增出口/端点/标签维度；`agent.turn` 根 span
  新增 `agent.turn.outcome=error` + `turn_error:` 状态承接子 span 失败。见
  `docs/audit/observability-audit-2026-10-25.md` 与 `.dev-team/contract-matrix-wave45.md`。
  【wave-49 增补｜OTel 准入 token 改构建期烧录（ADR 0049，用户零配置）】
  根因：桌面端此前**没有任何 OTel token 分发通道**（settings 手填 / env 之外全无），
  release.yml 只烧录 PonySentry token，仓库也缺 `PONY_OTEL_TOKEN` secret ⇒ 实测 24h 零 trace
  而同期探针正常。修法：`PONY_OTEL_BUILD_TOKEN` 构建期烧录（release.yml 从 secret 注入），
  优先级 **settings > env > 构建期 > 缺省**，空白视为未配置（fail-closed）。
  安全取舍（ADR 0049 显式承认）：token 内嵌安装包可被提取；当前 edge 本就是单 token 模型，
  按设备吊销不成立，吊销代价 = 重新发版；该 token 只能写、不能读，edge 侧有 120 req/min/IP
  与 16MiB/请求上限。四维归属不变（仍是 tracing 维度，唯一落点仍为 otel/mod.rs）。

  【wave-49 归属登记｜真实链路巡检驱动的四项缺陷修复（均不改四维归属）】
  (1) tracing｜检索键分裂：公网 edge 会把 `service.name` 改写成 `desktop-client`，
      集群内直连则保留 `pony-agent` ⇒ 同一产品两条 ingest 路径产出不同检索键，查询口径分裂
      （实测：查 `desktop-client` 全空、查 `pony-agent` 才命中）。修法：resource 恒带
      `pony.app.name=pony-agent`（`pony.*` 前缀语义属性不被 edge 改写），作为跨路径唯一稳定键。
  (2) tracing｜`deployment.environment` 误标：原先按 `debug_assertions` 推断，而本地
      `cargo build --release` 同样为 false ⇒ 开发机会话被标成 production（实测已发生）。
      修法：环境判定改为 `PONY_OTEL_ENVIRONMENT` > 构建期 `PONY_RELEASE_BUILD=1`
      （仅 release.yml 注入）> `development` 兜底。`PONY_RELEASE_BUILD` 只由发布工作流注入。
  (3) tracing｜根 span 无用量汇总：token 只在子 span `llm.chat` 上，`agent.turn` 根 span
      缺 `gen_ai.usage.*` ⇒ 多 hop 会话成本需跨 span 拼装。修法：`ActiveTurn` 累计用量并在
      `TurnTraceGuard::drop` 回填根 span（缺值不输出键，保持既有"不输出空占位"约定）。
  (4) tracing｜`tool.call` span 时长恒为 ~0：`record_tool_call_span` 曾是「创建即 end」，
      span 只覆盖登记动作（实测：834ms 的工具导出成 0.002ms，真值只在属性
      `agent.tool.duration_ms`）⇒ Tempo 瀑布图工具耗时不可见。修法：按 `duration_ms`
      反推起点 `with_start_time` + `end_with_timestamp`；加 24h 回填上限（异常大 duration
      退化为零长 span，跨平台确定；超限原始值仍保留在属性里）。
  (5) issues｜CLI/TUI/headless 无凭据分发通道：token 只能来自构建期烧录或运行时 env，
      而桌面端以外没有构建期通道 ⇒ 实测 provider 真实失败后 PonySentry 零事件。
      修法：`AppSettings` 新增 `ponysentryIngestUrl` / `ponysentryClientToken`（camelCase 落盘、
      Debug 打码、`settings.json` 0600 收紧），解析优先级 settings > env > 构建期 > 缺省；
      `bin/cli.rs`、`bin/tui.rs`、`src-tauri/src/lib.rs` 启动时调用 `init_from_settings`。
      fail-closed 不变：无 token ⇒ 零 egress（不 spawn worker、不发请求）。
  (6) 巡检工具面补强：`scripts/observability/check-langfuse.sh` 补上「语义轨是否有数据」
      这一动态判据（原 T5 仅静态检查；本项目 `ai_tier=agent` ⇒ Langfuse 必需）。
      凭据经 stdin 管道进入探针 shell，不进 argv、不落盘；缺凭据判 UNKNOWN 而非 PASS。

  【wave-46 归属登记】前端与语义轨交互增强：
  (1) 前端交互轨迹：全局面包屑强化为有界环形缓冲（30 条），自动捕获页面导航（`navigate_page`）
      并在推入时做深度截断与凭据清洗，丰富排障上下文；
  (2) 局部错误边界：新增 `ErrorBoundary.vue` 组件，使用 Vue 3 `onErrorCaptured` 拦截并阻止
      子组件异常冒泡整屏，触发 `reportError` 并在局部渲染具备重试恢复机制的优雅降级卡片；
  (3) Langfuse 用户归因：`crates/pony-agent-core/src/agent/otel/mod.rs` 支持环境变量
      `PONY_OTEL_USER_ID`，在 `begin_turn_trace` 根 span 中规范映射 `langfuse.user.id`。
  四维归属保持不变，唯一落点仍为既有 anchor。

  【wave-51 归属登记｜真实会话审计驱动的三项值错/缺项修复（ADR 0051）】
  (1) tracing｜版本归因：resource `service.version` 改为三级优先（宿主注入 app 版本 > env
      `PONY_OTEL_SERVICE_VERSION` > core crate 版本），PonySentry `release` 同源注入；
