  (5) issues / logs / metrics｜**四维归属不变**：本波不新增异常码、不新增日志出口、
      不新增端点/环境变量/依赖；metrics 仍为结构性 N/A（同本文档 metrics 维度声明）。
      tracing 唯一落点仍 `crates/pony-agent-core/src/agent/otel/mod.rs`（新增入口均为附加式）。

