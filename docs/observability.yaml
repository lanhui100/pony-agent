      同构（幂等 + 未装配跳过 + 失败只降级 warn），且**直接复用** core 的常量（r2-dim1 attempt 2
      删掉桌面端那份独立 `EXIT_FLUSH_BUDGET_MS=1000`，避免两处各写各的再次漂移）。
      预算口径（attempt 2 校正）：`EXIT_FLUSH_BUDGET_MS = EXPORT_TIMEOUT_MS = 3000ms`，
      `SHUTDOWN_TIMEOUT_MS = 100ms`（只够关闭握手，不承担导出）⇒ flush 步不超过 NFR
      `observability.exporter_flush_timeout_ms=3000`；成功路径 flush 后队列已空，关闭 µs 级返回，
      两段是顺序上限而非求和常态。
      动因（attempt 1 反证）：`BATCH_SCHEDULED_DELAY_MS=5000` 远大于关闭等待窗口且单次导出
      网络超时 3000ms；当 flush 预算只有 1000ms 时，`recv_timeout(1000)` 必先于导出完成而超时，
      `shutdown` 走 `mem::forget` 后进程退出 ⇒「加了 flush」与「没加」等价
      （重放实测 `s1-t02-read-explain` 三行 warn 连发且根 span 整条缺失）。
      预算 ≥ 一次导出最坏耗时，是「导出完成」这一语义成立的必要条件。
  (5) 收口点：不新增 enforcement_point。行为门机械收口在
      `crates/pony-agent-core/tests/otel_request_transport_test.rs`（2 用例：四键齐备 + 首包事实
      只属流式 + 常量字面量冻结），以及 `crates/pony-agent-core/src/agent/runtime/tests.rs` 的
      `llm_request_mode_labels_and_attributes_stay_in_sync`（四键出口一致性）。
      端到端裁决由 `scripts/audit/assertions/dim1.sh` 退出码承担。

  【归属登记（2026-11-09）｜PA-171 / ADR 0103：失败语义归因 additive 字段】
  一行结论：tracing 维度 applicable 与 anchor 均不变（仍 `agent/otel/mod.rs`），不新增 metrics / logs / issues 面，
  也不新增 enforcement_point；变更只是把失败轮的归因字段从「硬编码缺席」改为「有值」，让维度 3（失败语义）可机判。
  (1) additive 属性：失败事件与落盘 `TurnTraceRecord` 增 `errorClass`
      （取值 `timeout|rate_limited|quota|network|auth|bad_request|other`，唯一来源
      `retry::classify_error_class`）；`None` ⇒ 键缺席，旧读取端不读即行为不变。
  (2) 归因真值：`providerSource` 由 `null` 改为 `provider_attempt_failed:{requested_name}`；
      `providerMode` 仍为 `failed`（与既有失败 `TurnResult` 同值，如实保留）；
      `fallbackReason` 记录触发方（`provider_decision_failed` / `provider_followup_failed`），
      使「首跳 decision 失败」与「工具 followup 失败」可机判。
  (3) 收口点：不新增 enforcement_point。行为门机械收口在
      `crates/pony-agent-core/tests/pa171_failed_turn_attribution_contract.rs`（wire 键常驻 + 三字段非占位 + 六条真值表）
      与 `pa171_provider_rate_limit_cooldown_contract.rs`（限流单次调用 1 次 HTTP / 冷却期 0 次 HTTP / 503 仍重试）。
