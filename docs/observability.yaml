# pony-agent 的可观测性适用性声明
# 形状：~/.agents/skills/observability-onboarding/references/declaration.schema.json
# 判定：声明说「该不该有」，巡检说「实际有没有」，两者交叉才是结论（规则家：declaration-rubric.md）。
# 结构性依据：`.dev-team/evidence/wave43/observability-applicability.md`（wave-43 适配性裁决）。
service: pony-agent
kind: desktop
reviewed_at: "2026-11-01"

dimensions:
  tracing:
    applicable: true
    # OTel 初始化/导出/资源属性的唯一落点（span 与 resource 构造、配置解析、traceparent 注入器都在这个模块）
    anchor: crates/pony-agent-core/src/agent/otel/mod.rs
  issues:
    applicable: true
    # PonySentry ingest 客户端（事件上报/幂等键 event_id/trace_id 回填/重试都在这里）
    anchor: crates/pony-agent-core/src/agent/ponysentry/client.rs
  metrics:
    applicable: false
    reason: >-
      桌面端（Tauri）+ CLI/TUI + headless harness 交付形态：进程随用户窗口启停，无常驻监听地址、
      无 Service、不进集群，Prometheus pull 模型的前提（稳定可达的 /metrics）结构上不成立。
      这不是「还没接」，而是这套接法不适用于该交付形态；为让巡检变绿而伪造 /metrics 已被明确拒绝。
  logs:
    applicable: false
    reason: >-
      日志采集是节点侧 fluentd 按容器日志路径白名单（/var/log/containers/*.log）tail；
      桌面端进程不在容器里、不产生该路径，节点侧采集结构上不适用。Wave-4 起桌面端日志已落
      `<app_data_dir>/logs/pony-agent.log`（单行 JSON + trace_id + 512KiB 轮转），但那是用户数据面
      的本地取证面；不上送 Loki 仍是结构性选择而非缺口。

enforcement_points:
  error_boundary:
    path: src/components/common/ErrorBoundary.vue
    guarantees:
      - breadcrumbs
      - trace_id
    forbidden_in_other_files:
      - pattern: "\\bonErrorCaptured\\s*\\("
        hint: 前端组件级异常捕获必须统一使用 ErrorBoundary.vue 统一收口与上报，禁止在别处私自声明 onErrorCaptured

  http_client:
    path: crates/pony-agent-core/src/agent/otel/mod.rs
    guarantees:
      - traceparent
      - timeout
    forbidden_in_other_files:
      - pattern: "\\bheader\\s*\\(\\s*[\"']traceparent[\"']"
        hint: 出网 HTTP 请求必须通过 otel::with_current_traceparent / traceparent_header_map_from 统一注入 traceparent，禁止手写硬编码请求头

note: >-
  【收口点落地说明（Stage-1 Protocol）】
  (1) error_boundary: 收敛至 src/components/common/ErrorBoundary.vue，提供 Vue 3 onErrorCaptured 拦截、优雅降级及上报。
  (2) http_client: 收敛至 crates/pony-agent-core/src/agent/otel/mod.rs，提供统一 with_current_traceparent 注入防重复与超时保证。
  【历史 backlog 留存】
  (0) Wave-4 已收敛但**未达 enforcement_point 标准**（故暂不声明）：
      traceparent 注入收敛为单一 helper `otel::with_current_traceparent` /
      `traceparent_header_map`（provider ×4、model_catalog、tools ×2、PonySentry worker 共 8 点
      全部经它注入，insert 语义防重复）；OTel 配置解析收敛为 `otel::resolve_config`
      （settings > env > default，缺省公网端点 https://otel.ponyjob.top）；
      trace_id 语义已分离：`exported_trace_id()` 供 issue/会话 DTO，`current_trace_id()` 供日志/traceparent。
      不写 enforcement_point 的理由：reqwest 客户端本身仍是 4 处直连，helper 只能约束「调用者主动调它」，
      无法用 forbidden 正则可靠拦截「新增客户端却不调 helper」，写了会造成假绿。
  (1) http_client：无统一网络出口 —— Rust 侧 4 处直接 reqwest::Client
      （agent/otel/mod.rs、agent/tools.rs、agent/provider/mod.rs、agent/ponysentry/client.rs），
      前端另有直接 fetch（src/lib/telemetry.ts、src/lib/update-check.ts）。
  (2) error_boundary：无唯一边界 —— 前端 src/main.ts 有全局 errorHandler/unhandledrejection，
      Rust 侧多处 catch_unwind 与各自上报路径尚未收敛到一个 re-export 边界。
  (3) error_classifier：crates/pony-agent-core/src/agent/error_code.rs 提供 ErrorCode/ErrorCategory，
      但 retry.rs 的 classify 与各 provider 仍各自分类（该模块头注释亦写明「只新增不改旧分支」），
      故它不是唯一分类器。
  (4) issue 上报存在两条实现：前端 src/lib/telemetry.ts 直接 fetch ingest，Rust 走
      agent/ponysentry/client.rs。
  (5) 无 journey.yaml（anchor_events 机制未启用）。
  收口点建好之后再按 schema 补 enforcement_points（path + guarantees + forbidden_in_other_files），
  且顺序是先确认「当前无违规」再写 forbidden，避免门禁一落地就红。
  【wave-44 归属登记】前端 `[workspace-scroll]` 调试通道新增显式开关
  （`pony-agent.debug.workspace-scroll` / `?debug=1|scroll` / DEV，默认生产关闭），属开发者诊断输出，
  非结构化日志出口：四维归属不变（logs 仍为结构性 N-A），不新增 metrics/tracing/issues 面。
  审计事实与优化点见 `docs/audit/observability-audit-2026-10-25.md`。
  【wave-45 归属登记】tracing 维度新增 resource 归因属性：`service.version`（默认 core crate 版本，
  可由 `PONY_OTEL_SERVICE_VERSION` 覆盖）与 `deployment.environment`（默认 debug=`development` /
  release=`production`，可由 `PONY_OTEL_ENVIRONMENT` 覆盖）。维度归属不变（仍为 tracing，唯一落点仍是
  `crates/pony-agent-core/src/agent/otel/mod.rs`），不新增出口/端点/标签维度；`agent.turn` 根 span
  新增 `agent.turn.outcome=error` + `turn_error:` 状态承接子 span 失败。见
  `docs/audit/observability-audit-2026-10-25.md` 与 `.dev-team/contract-matrix-wave45.md`。
  【wave-49 增补｜OTel 准入 token 改构建期烧录（ADR 0049，用户零配置）】
  根因：桌面端此前**没有任何 OTel token 分发通道**（settings 手填 / env 之外全无），
  release.yml 只烧录 PonySentry token，仓库也缺 `PONY_OTEL_TOKEN` secret ⇒ 实测 24h 零 trace
  而同期探针正常。修法：`PONY_OTEL_BUILD_TOKEN` 构建期烧录（release.yml 从 secret 注入），
  优先级 **settings > env > 构建期 > 缺省**，空白视为未配置（fail-closed）。
  安全取舍（ADR 0049 显式承认）：token 内嵌安装包可被提取；当前 edge 本就是单 token 模型，
  按设备吊销不成立，吊销代价 = 重新发版；该 token 只能写、不能读，edge 侧有 120 req/min/IP
  与 16MiB/请求上限。四维归属不变（仍是 tracing 维度，唯一落点仍为 otel/mod.rs）。

  【wave-49 归属登记｜真实链路巡检驱动的四项缺陷修复（均不改四维归属）】
  (1) tracing｜检索键分裂：公网 edge 会把 `service.name` 改写成 `desktop-client`，
      集群内直连则保留 `pony-agent` ⇒ 同一产品两条 ingest 路径产出不同检索键，查询口径分裂
      （实测：查 `desktop-client` 全空、查 `pony-agent` 才命中）。修法：resource 恒带
      `pony.app.name=pony-agent`（`pony.*` 前缀语义属性不被 edge 改写），作为跨路径唯一稳定键。
  (2) tracing｜`deployment.environment` 误标：原先按 `debug_assertions` 推断，而本地
      `cargo build --release` 同样为 false ⇒ 开发机会话被标成 production（实测已发生）。
      修法：环境判定改为 `PONY_OTEL_ENVIRONMENT` > 构建期 `PONY_RELEASE_BUILD=1`
      （仅 release.yml 注入）> `development` 兜底。`PONY_RELEASE_BUILD` 只由发布工作流注入。
  (3) tracing｜根 span 无用量汇总：token 只在子 span `llm.chat` 上，`agent.turn` 根 span
      缺 `gen_ai.usage.*` ⇒ 多 hop 会话成本需跨 span 拼装。修法：`ActiveTurn` 累计用量并在
      `TurnTraceGuard::drop` 回填根 span（缺值不输出键，保持既有"不输出空占位"约定）。
  (4) tracing｜`tool.call` span 时长恒为 ~0：`record_tool_call_span` 曾是「创建即 end」，
      span 只覆盖登记动作（实测：834ms 的工具导出成 0.002ms，真值只在属性
      `agent.tool.duration_ms`）⇒ Tempo 瀑布图工具耗时不可见。修法：按 `duration_ms`
      反推起点 `with_start_time` + `end_with_timestamp`；加 24h 回填上限（异常大 duration
      退化为零长 span，跨平台确定；超限原始值仍保留在属性里）。
  (5) issues｜CLI/TUI/headless 无凭据分发通道：token 只能来自构建期烧录或运行时 env，
      而桌面端以外没有构建期通道 ⇒ 实测 provider 真实失败后 PonySentry 零事件。
      修法：`AppSettings` 新增 `ponysentryIngestUrl` / `ponysentryClientToken`（camelCase 落盘、
      Debug 打码、`settings.json` 0600 收紧），解析优先级 settings > env > 构建期 > 缺省；
      `bin/cli.rs`、`bin/tui.rs`、`src-tauri/src/lib.rs` 启动时调用 `init_from_settings`。
      fail-closed 不变：无 token ⇒ 零 egress（不 spawn worker、不发请求）。
  (6) 巡检工具面补强：`scripts/observability/check-langfuse.sh` 补上「语义轨是否有数据」
      这一动态判据（原 T5 仅静态检查；本项目 `ai_tier=agent` ⇒ Langfuse 必需）。
      凭据经 stdin 管道进入探针 shell，不进 argv、不落盘；缺凭据判 UNKNOWN 而非 PASS。

  【wave-46 归属登记】前端与语义轨交互增强：
  (1) 前端交互轨迹：全局面包屑强化为有界环形缓冲（30 条），自动捕获页面导航（`navigate_page`）
      并在推入时做深度截断与凭据清洗，丰富排障上下文；
  (2) 局部错误边界：新增 `ErrorBoundary.vue` 组件，使用 Vue 3 `onErrorCaptured` 拦截并阻止
      子组件异常冒泡整屏，触发 `reportError` 并在局部渲染具备重试恢复机制的优雅降级卡片；
  (3) Langfuse 用户归因：`crates/pony-agent-core/src/agent/otel/mod.rs` 支持环境变量
      `PONY_OTEL_USER_ID`，在 `begin_turn_trace` 根 span 中规范映射 `langfuse.user.id`。
  四维归属保持不变，唯一落点仍为既有 anchor。

  【wave-51 归属登记｜真实会话审计驱动的三项值错/缺项修复（ADR 0051）】
  (1) tracing｜版本归因：resource `service.version` 改为三级优先（宿主注入 app 版本 > env
      `PONY_OTEL_SERVICE_VERSION` > core crate 版本），PonySentry `release` 同源注入；
      解决 trace/Langfuse `version` 与 PonySentry `last_release` 指向 core 计数线（0.1.135/0.1.128）
      而非安装包发布线的问题。维度归属不变（仍 tracing，落点仍 `agent/otel/mod.rs` + 宿主装配点）。
  (2) tracing｜治理归属：`governance.decide` 补 `langfuse.session.id`（复用既有 helper，无活跃 turn
      不输出），会话过滤命中 9/9，治理决策进入语义轨。
  (3) tracing｜用量明细：`llm.chat` 与根 `agent.turn` 新增 `gen_ai.usage.reasoning.output_tokens` /
      `gen_ai.usage.cache_read.input_tokens`（semconv 标准名；有值才写、0 有效、`u64→i64` 饱和；
      cache 键仅 OpenAI 协议族上报，Anthropic 语义 fail-closed 且登记为已知限制）。
  四维归属不变：不新增 metrics/logs/issues 出口，不新增端点/环境变量/依赖；tracing 唯一落点不变。

  【wave-53 归属登记｜第二轮真实会话审计（会话 pa_01a17c85 / trace eed9ba47）驱动的语义轨补全（ADR 0052）】
  (1) tracing｜成本口径：`llm.chat` 增 `langfuse.observation.cost_details`（input/output/total 三分量，
      有价才发）与 `pony.cost.priced`（有 usage 无成本 ⇒ false）：在 Tempo/原始属性面可区分「0 元」与
      「未计价」，Langfuse 展示面仍为 `costDetails={}` / 0（无价模型需产品侧补价后才有数值）；
      网关型号缺单价仍无成本数值，属产品侧补价待办（不计入本维缺口）。
  (2) tracing｜枚举收敛：`gen_ai.system` 改为协议枚举（openai/anthropic/google/generic），
      展示名（PonyLlm）迁至 `gen_ai.provider.name`；跨宿主同协议取值一致。
  (3) tracing｜失败语义：新增 `agent.turn.degraded`（completed 且有工具失败）与
      `agent.turn.tool_failures`；既有 phase/outcome/status 语义零变更（成功率与错误率口径解耦）。
  (4) tracing｜可读性：`langfuse.trace.name` = `pony-agent#turn-<sequence>`（原为数字 turn id）。
  (5) tracing｜工具对账：`tool.call` 增 `gen_ai.tool.call.id`（模型侧 call id）。
  四维归属不变：仍不新增 metrics/logs 出口（N-A 结构性理由不变），issues 落点不变；
  tracing 唯一落点仍 `crates/pony-agent-core/src/agent/otel/mod.rs`（新增入口均为附加式，旧签名不动）。
  已知待办（不在本维闭环内）：Langfuse trace 级 usage/totalCost 恒空属 infra 侧聚合行为；
  `langfuse.user.id` 仍仅由 env 注入（用户归因需产品决策）。

  【wave-54 归属登记｜token / 速度口径真值（ADR 0053）】
  (1) tracing｜per-call 真值键：`llm.chat` 增 `llm.call.duration_ms` / `llm.call.ttft_ms`（有值才写）/
      `llm.call.generation_ms`；根 `agent.turn` 增 `agent.turn.duration_ms` / `agent.turn.ttft_ms` /
      `agent.turn.calls` / `agent.turn.speed.tokens_per_second` + `agent.turn.speed.basis=turn_weighted`。
      此前 `record_turn_speed` 为 dead code（全仓 0 调用），速度在 tracing 面无可对账属性；
      本波把 UI 显示值与其 span 真值收敛为同一公式（Σoutput / Σ(duration−ttft)）。
  (2) tracing｜用量来源与上下文：新增 `agent.usage.origin`（`provider` | `estimated_chars`），
      把「provider 上报」与「chars/4 估算」显式分离（此前估算值冒充真值且无标记）；
      `gen_ai.usage.context_window` / `context_ratio` 改为传真实 `provider.context_window_tokens()`
      （此前 4 个调用点恒传 `None`，24h 实测 0 条 trace 带该键）。
  (3) 四维归属不变：不新增 metrics/logs 出口（N-A 结构性理由不变），issues 落点与异常码不变；
      新增键全部为附加式（旧属性值与既有签名零变更），tracing 唯一落点仍为
      `crates/pony-agent-core/src/agent/otel/mod.rs`。

  【arch-remediation 归属登记（2026-11-01）｜架构评估缺陷修复波】
  (1) tracing｜LLM 出网超时语义变更：provider 流式客户端原把 180s 设为 reqwest **总 deadline**
      （`.timeout()`），会硬截断超过 180s 的长推理流；本波改为 connect_timeout 15s +
      read/idle 180s（`provider/mod.rs`）。tracing 面不受影响：`llm.chat` 计时仍取真实首token/完成时刻，
      仅"被误截断"的假失败消失；`otel::with_current_traceparent` 注入路径未改动。
  (2) issues｜MCP 子进程环境隔离：`env_clear()` + 白名单透传后，启动失败仍经既有 `McpClientError`
      → 既有 boundary 上报；secret store 明文回退告警走既有日志通道，**不新增出口/端点**。
  (3) 沙箱可用性诚实化：`NativeSandboxBackend` 不再仅凭 PATH 探测即声称强制隔离，属安全语义修正，
      不新增遥测维度；`SandboxRequest.allow_network` 仍无消费点（本波仅加"未强制"注释，登记为待办）。
  (4) 四维归属不变：metrics / logs 仍为结构性 N-A（理由见上），issues/tracing 落点不变；
      本波不新增端点、环境变量或依赖。前端启用 CSP 属渲染层安全收口，不新增遥测出口。

  【wave-slash-1 归属登记（2026-11-01）｜斜杠命令 /compact：手动压缩控制面 + Tauri 命令】
  (1) tracing｜**适用（维度适用）但本功能当前不产生 span —— 如实声明，不是"沿用既有 span"**：
      手动压缩**不经过** turn 执行路径（`turn_flow::provider_decision_stream_guarded` 的
      `llm.chat` 子 span 与 `begin_turn_trace` 的 `agent.turn` 根 span 都只在 turn 作用域内创建），
      压缩发生在 `agent/runtime/compaction_ops.rs`（不走 turn_flow），因此：
      **压缩调用在 trace 中不可见**（零 span）；provider HTTP 层仅在存在活动 trace 上下文时透传
      traceparent，手动压缩没有活动上下文 ⇒ 亦无 traceparent 注入。
      结构性理由：压缩是**会话维护动作**（用户主动触发的上下文整理），不隶属于任何一轮 turn，
      没有可供挂载的 turn 根 span；若强行用零散 span 表达，只会产出无父的孤儿 span，污染会话瀑布图。
      欠账登记见本节末「待办/欠账」第 (D1) 条（编号 `OBS-DEBT-COMPACT-SPAN-1`）。
  (2) issues｜**适用**，落点不变（`crates/pony-agent-core/src/agent/ponysentry/client.rs`）：
      `compact_session` 失败经既有 `Result<_, String>` 上抛给宿主（TUI 追加 System 消息、
      桌面经 notice 展示、CLI 打印错误行），LLM 失败**不静默吞掉**（契约 C-1 第 5 条）；
      不新增异常码、不新增 ingest 出口、不改上报门禁。
  (3) metrics｜**结构性 N/A，理由与本文档 metrics 维度声明同源**：该命令是桌面端进程内 IPC 入口，
      无常驻监听地址、无 Service、不进集群，Prometheus pull 模型（稳定可达的 /metrics）前提结构上不成立；
      手动压缩是用户主动触发的会话动作，其频次/压缩量不构成需要抓取的进程指标面。
  (4) logs｜**结构性 N/A，理由与本文档 logs 维度声明同源**：节点侧 fluentd 只按容器日志路径
      （/var/log/containers/*.log）tail，桌面端进程不在容器内、不产生该路径。压缩结果以单行
      `runtime_log`（`compact:session=... compressed=... kept=...`）落入既有本地取证面
      `<app_data_dir>/logs/pony-agent.log`；不上送 Loki 仍是结构性选择而非缺口。
  (5) 不新增依赖、环境变量、托管端点与对外契约字段的遥测；返回结构为 core 内
      `ManualCompactionOutcome`（camelCase 序列化由既有 Tauri DTO 约定保证）。
      四维归属结论：tracing / issues 适用且落点不变，metrics / logs 仍为结构性 N/A。
  (6) 待办/欠账（D1）｜编号 `OBS-DEBT-COMPACT-SPAN-1`：**手动压缩当前零 span，trace 不可见**。
      主责：exec-rust（本波实现者）/ 后续 tracing 责任面。
      触发条件（满足任一条即须先补 span 再谈"已接 tracing"）：
      (a) 观测需求要求按会话看到压缩耗时或压缩次数；
      (b) 压缩被纳入 trace 对账/成本口径；
      (c) 出现"压缩后上下文异常"类排障需要 trace 证据。
      落地前置（必须先定义，不许边写边定）：span 名（建议 `agent.session.compact`）、
      session 归属键（复用 `langfuse.session.id` 既有 helper）、父 span 语义（无 turn 上下文时
      作为 root span，并显式标注 `pony.compact.parent=none`），以及成功/未压缩/失败三态属性。

  【ADR 0055 归属登记（2026-11-01）｜真实 trace 审计驱动的四项口径修复 + 三项优化】
  (1) tracing｜用量口径（**适用**，落点不变 `agent/otel/mod.rs`）：上下文容量/比例迁出 `gen_ai.usage.`
      前缀（→ `llm.context.window_tokens` / `llm.context.ratio`），思考 token 迁至
      `llm.reasoning.output_tokens`。依据：Langfuse OTel ingest 把 `gen_ai.usage.*` 的每个数值键
      求和进 `usage.total`，导致每次调用 total 被抬高 1,000,000（真实 trace `f47fd028`：
      total=1,007,675，真值约 7,675）；合成探针（12 例）实测改键名后 total 恢复 1,200。
      用量三键（input/output/cache_read）保持 semconv 名不动：它们是 Langfuse 扣减与计费依据。
  (2) tracing｜首包时点（**适用**）：新增 `ProviderStreamChunk::StreamStart`（无内容事件），
      由 openai_sse 首个 SSE data 事件与 anthropic 首个 SSE 事件各发一次，使纯工具调用步骤也能
      记录 `llm.call.ttft_ms`（此前 15 次调用中 6 次缺失、速度被系统性低估）。
      该变体不携带内容、不进 UI 增量、不新增出口。
  (3) tracing｜轮次序号与错误语义（**适用**）：`agent.turn.sequence` 改取会话已登记轮次数
      （原两处硬编码 0，导致所有 trace 同名 `pony-agent#turn-0@…`）；
      `non_zero_exit` 不再提升为整轮 `outcome=error`/根状态 ERROR，只保留
      `agent.turn.tool_failures` / `agent.turn.degraded`（保留工具子 span 的 ERROR 与错误摘要）。
      依据：3/3 生产 trace 曾因 `grep` 无匹配 exit 1 被记为整轮失败。
  (4) tracing｜新增派生指标与归因键（**适用**）：`llm.context.cache_hit_ratio`
      （= `cache_read/input`，把「同一轮第 7 次调用前缀缓存全失效」变成可告警指标）；
      根 span 增 `langfuse.release`（= 已解析 `service.version`，修复 `trace.release=null`）。
  (5) issues / logs / metrics｜**四维归属不变**：本波不新增异常码、不新增日志出口、
      不新增端点/环境变量/依赖；metrics 仍为结构性 N/A（同本文档 metrics 维度声明）。
      tracing 唯一落点仍 `crates/pony-agent-core/src/agent/otel/mod.rs`（新增入口均为附加式）。

