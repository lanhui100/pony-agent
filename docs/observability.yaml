  【ADR 0055 归属登记（2026-11-01）｜真实 trace 审计驱动的四项口径修复 + 三项优化】
  (1) tracing｜用量口径（**适用**，落点不变 `agent/otel/mod.rs`）：上下文容量/比例迁出 `gen_ai.usage.`
