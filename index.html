<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ============================ CSP 说明（单一真值源：src-tauri/tauri.conf.json） ============================
      ⚠ 生产 CSP 的唯一真值源是 `src-tauri/tauri.conf.json` → `app.security.csp`（Tauri 在构建期把它
      注入 index.html 的 meta 与响应头，并按需追加 nonce）。下面的 meta 只是**镜像**，故意保持注释：
      一旦启用，`script-src 'self'` 会直接打断 `npm run dev`/纯浏览器预览（Vite 注入的内联客户端与
      HMR ws 无 nonce 可匹配）。这是刻意配置，不是漏配；改 CSP 请改 tauri.conf.json。
      ── 取舍记录 1（connect-src 的 ponysentry host）────────────────────────────────
      `https://ponysentry.ponyjob.top` 与 `.github/workflows/release.yml` 的
      `VITE_PONYSENTRY_INGEST_URL` 缺省值同源（telemetry.ts:12 处亦有等价注释）：
      发布版 issue 上报的 fetch 降级路径直连该 host，漏配会被 CSP 静默掐死。三处必须同改。
      ── 取舍记录 2（tauri.conf.json 的 dangerousDisableAssetCspModification）────────
      该项只关掉 **style-src 的 nonce 注入**（Tauri codegen 会给每个 `<style>` 打 nonce，运行期把
      `'nonce-…'` 追加进 style-src；按 CSP3 只要存在 nonce，`'unsafe-inline'` 即失效 ⇒ Vue 的
      `:style`/`style=` 全部被拦、UI 直接崩）。script-src 不受影响，仍由 Tauri 的 nonce/hash 机制
      保护（仅对 `script[src^='http']` 注入，本项目全部为同源 `'self'` 脚本，无需 nonce）。
      注：tauri.conf.json 是严格 JSON（未启用 config-json5 特性，见
      tauri-utils-2.10.1/src/config/parse.rs:288-296），无法写行内注释，故取舍记录落在本文件。
    ==================================================================================================== -->
    <!-- 浏览器预览用 meta CSP：与 tauri.conf.json app.security.csp prod 口径一致（同串镜像）。
      事实（勿再写成「Tauri 不支持 dev/prod 分键」——那是错的）：tauri-utils-2.10.1
      config.rs:3041-3051 确有 `app.security.devCsp`，**且未配 devCsp 时生产 csp 也会注入 dev**。
      本项目当前未配 devCsp ⇒ `tauri dev` 同样受上面的生产 CSP 约束；将来要放宽 dev，
      **只能加 `app.security.devCsp`**（e.g. connect-src 增 ws://127.0.0.1:4176、script-src 容内联），
      禁止往生产 `csp` 里加 'unsafe-inline' / ws:。
      本 meta 仅覆盖纯浏览器预览（非 Tauri WebView）场景，默认保持注释：启用后 `script-src 'self'`
      会打断 `npm run dev`（Vite 内联客户端 + HMR ws 无 nonce 可匹配）。 -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost https://api.github.com https://s3.local.ponyjob.top https://ponysentry.ponyjob.top; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'self'; form-action 'self'" /> -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Pony Agent</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading-screen" aria-live="polite">
      <style>
        #app-loading-screen {
          position: fixed;
          inset: 0;
          z-index: 999999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at top, rgba(248, 226, 184, 0.25), transparent 45%),
                      linear-gradient(180deg, #fdfbf9 0%, #faf7f2 50%, #f4ede2 100%);
          user-select: none;
          -webkit-user-select: none;
          transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #app-loading-screen.fade-out {
          opacity: 0;
          visibility: hidden;
          pointer-events: none !important;
        }
        .loading-title-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }
        .loading-badge {
          width: 52px;
          height: 52px;
          border-radius: 14px;
          box-shadow: 0 10px 25px -4px rgba(217, 119, 6, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
          animation: loading-pulse 2.2s ease-in-out infinite;
        }
        .loading-brand-title {
          font-family: -apple-system, BlinkMacSystemFont, "Montserrat", "Arial Black", "Impact", "Trebuchet MS", "Segoe UI", sans-serif;
          font-size: 2.1rem;
          font-weight: 900;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          background: linear-gradient(135deg, #1c1917 0%, #44403c 45%, #b45309 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-shadow: 0 2px 12px rgba(217, 119, 6, 0.12);
          margin: 0;
          padding-left: 0.18em;
        }
        .loading-progress-bar {
          width: 140px;
          height: 3px;
          background: rgba(120, 113, 108, 0.12);
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
          margin-top: 4px;
        }
        .loading-progress-indicator {
          position: absolute;
          top: 0;
          bottom: 0;
          left: -40%;
          width: 40%;
          background: linear-gradient(90deg, #d97706, #f59e0b);
          border-radius: 9999px;
          animation: loading-shimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes loading-pulse {
          0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.25)); }
          50% { transform: scale(1.05); filter: drop-shadow(0 8px 18px rgba(245, 158, 11, 0.38)); }
        }
        @keyframes loading-shimmer {
          0% { left: -40%; width: 40%; }
          50% { left: 30%; width: 50%; }
          100% { left: 100%; width: 40%; }
        }
      </style>
      <div class="loading-title-container">
        <img class="loading-badge" src="/src/assets/pony-brand-icon.png" alt="" />
        <h1 class="loading-brand-title">PONY AGENT</h1>
        <div class="loading-progress-bar">
          <div class="loading-progress-indicator"></div>
        </div>
      </div>
    </div>
  </body>
  </html>
