[package]
name = "pony-agent-core"
version = "0.1.57"
edition = "2021"

[lib]
name = "pony_agent_core"

[dependencies]
anydoc = "=0.1.6"
dirs = "6"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "stream"] }
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent"] }

[dev-dependencies]
zip = "8.6"


























































