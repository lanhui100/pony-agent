[package]
name = "pony-tools"
version = "0.1.178"
edition = "2021"

[lib]
name = "pony_tools"

[dependencies]
pony-protocol = { path = "../pony-protocol" }
pony-observability = { path = "../pony-observability" }
pony-storage = { path = "../pony-storage" }
pony-provider = { path = "../pony-provider" }
tracing = "0.1"
anydoc = "=0.1.6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
encoding_rs = "0.8"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
pony-test-support = { path = "../pony-test-support" }
zip = "8.6"
