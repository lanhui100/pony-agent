[package]
name = "pony-acp"
version = "0.1.179"
edition = "2021"

[lib]
name = "pony_acp"

[dependencies]
pony-protocol = { path = "../pony-protocol" }
pony-observability = { path = "../pony-observability" }
pony-storage = { path = "../pony-storage" }
pony-provider = { path = "../pony-provider" }
pony-tools = { path = "../pony-tools" }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
