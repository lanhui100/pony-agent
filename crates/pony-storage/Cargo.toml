[package]
name = "pony-storage"
version = "0.1.179"
edition = "2021"

[lib]
name = "pony_storage"

[dependencies]
pony-protocol = { path = "../pony-protocol" }
pony-observability = { path = "../pony-observability" }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
